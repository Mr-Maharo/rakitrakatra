<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">

    <title>Rakitrakatra V4.2.0 - 100 Plugins</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #c0d8f0;
            font-family: 'Segoe UI', 'Courier New', monospace;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #66ddff;
            font-size: 28px;
            border-bottom: 2px solid #2a3a5a;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 small { font-size: 14px; color: #6688aa; }
        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
            justify-content: center;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: #0f1628;
            border-radius: 10px;
            border: 1px solid #1a2a44;
        }
        .nav button {
            background: #111f33;
            border: 1px solid #2a3a5a;
            color: #88bbdd;
            padding: 4px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .nav button:hover, .nav button.active {
            background: #1a3355;
            border-color: #66aaff;
            color: #ffffff;
        }
        .nav button.done {
            border-color: #44aa66;
            color: #88dd99;
        }
        #display {
            background: #111828;
            border: 1px solid #2a3a5a;
            border-radius: 12px;
            padding: 20px 24px;
            min-height: 400px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .plugin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3a5a;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .plugin-header .name {
            color: #88ddff;
            font-size: 24px;
            font-weight: bold;
        }
        .plugin-header .num {
            color: #335577;
            font-size: 14px;
        }
        .plugin-header .badge {
            background: #1a2a44;
            color: #77aacc;
            padding: 2px 14px;
            border-radius: 12px;
            font-size: 11px;
        }
        .plugin-desc {
            color: #99bbdd;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .plugin-demo {
            background: #0a0f1a;
            border: 1px solid #1a2a44;
            border-radius: 8px;
            padding: 16px 18px;
            margin: 10px 0;
            min-height: 60px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .plugin-demo .result {
            color: #88ddbb;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: #0d1222;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #1a2a44;
            min-width: 80px;
        }
        .plugin-demo .label {
            color: #6688aa;
            font-size: 12px;
        }
        .plugin-code {
            background: #0a0f1a;
            border: 1px solid #1a2a44;
            border-radius: 6px;
            padding: 12px 16px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #88ddbb;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .plugin-code .kw { color: #ff88aa; }
        .plugin-code .fn { color: #88ddff; }
        .plugin-code .str { color: #aadd88; }
        .plugin-code .numv { color: #ffaa66; }
        .plugin-code .cmt { color: #446688; }
        .btn-demo {
            background: #1a3355;
            border: 1px solid #4488cc;
            color: #88ddff;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-demo:hover {
            background: #224466;
            border-color: #66aaff;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #446688;
            font-size: 12px;
            border-top: 1px solid #1a2a44;
            padding-top: 16px;
        }
        .footer span { color: #66aadd; }
        .progress {
            text-align: center;
            color: #6688aa;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .progress span { color: #88ddff; font-weight: bold; }
        @media (max-width: 600px) {
            .plugin-header .name { font-size: 18px; }
            #display { padding: 14px; }
            .nav button { font-size: 9px; padding: 2px 8px; }
        }
    </style>
</head>

// ============================================================
// FANORINANA NY NAVIGATION
// ============================================================
const nav = document.getElementById('navButtons');
let currentIndex = 0;

// Boutons de navigation
const prevBtn = document.createElement('button');
prevBtn.textContent = '◄';
prevBtn.style.background = '#1a2a44';
prevBtn.style.borderColor = '#4488cc';
prevBtn.style.padding = '4px 16px';
prevBtn.style.fontSize = '16px';
nav.appendChild(prevBtn);

// Boutons pour chaque plugin
pluginsData.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.textContent = p.num;
    btn.dataset.index = i;
    if (i === 0) btn.classList.add('active');
    btn.addEventListener('click', () => showPlugin(i));
    nav.appendChild(btn);
});

// Bouton suivant
const nextBtn = document.createElement('button');
nextBtn.textContent = '►';
nextBtn.style.background = '#1a2a44';
nextBtn.style.borderColor = '#4488cc';
nextBtn.style.padding = '4px 16px';
nextBtn.style.fontSize = '16px';
nav.appendChild(nextBtn);

// ============================================================
// FAMPIASANA
// ============================================================
const pluginContent = document.getElementById('pluginContent');
const currentNum = document.getElementById('currentNum');
const totalNum = document.getElementById('totalNum');

totalNum.textContent = pluginsData.length;

function showPlugin(index) {
    currentIndex = index;
    const data = pluginsData[index];
    currentNum.textContent = data.num;

    // Mamaritra ny boutons
    const btns = nav.querySelectorAll('button[data-index]');
    btns.forEach((b, i) => {
        b.classList.toggle('active', i === index);
    });

    // Asehoy ny demo
    pluginContent.innerHTML = `
        <div class="plugin-header">
            <span class="name">${data.name}</span>
            <span>
                <span class="badge">${data.category || 'Plugin'}</span>
                <span class="num">#${data.num}</span>
            </span>
        </div>
        <div class="plugin-desc">${data.desc}</div>
    `;

    // Demo container
    const demoContainer = document.createElement('div');
    demoContainer.id = 'demoContainer';
    pluginContent.appendChild(demoContainer);

    // Miantso ny demo function
    if (data.demo) {
        data.demo(demoContainer);
    } else {
        demoContainer.innerHTML = `
            <div class="plugin-demo">
                <span class="label">✅ Plugin ${data.name} (${data.num})</span>
                <span class="result">Vita</span>
            </div>
        `;
    }

    // Code example
    if (data.code) {
        const codeDiv = document.createElement('div');
        codeDiv.className = 'plugin-code';
        codeDiv.innerHTML = data.code;
        pluginContent.appendChild(codeDiv);
    }
}

// Navigation
prevBtn.addEventListener('click', () => {
    const newIndex = (currentIndex - 1 + pluginsData.length) % pluginsData.length;
    showPlugin(newIndex);
});

nextBtn.addEventListener('click', () => {
    const newIndex = (currentIndex + 1) % pluginsData.length;
    showPlugin(newIndex);
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') {
        const newIndex = (currentIndex - 1 + pluginsData.length) % pluginsData.length;
        showPlugin(newIndex);
    } else if (e.key === 'ArrowRight') {
        const newIndex = (currentIndex + 1) % pluginsData.length;
        showPlugin(newIndex);
    }
});

// ============================================================
// FANOMBOKANA
// ============================================================
showPlugin(0);

console.log('✅ Rakitrakatra V4.2.0 loaded!');
console.log('📦 Total plugins:', pluginsData.length);
console.log('💡 Ampiasao ny ◄ ► na tsindrio ny isa');
