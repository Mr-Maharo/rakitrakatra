<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAKITRAKATRA V4.2.1 - Plugin Explorer</title>
<style>
:root{--bg:#0a0a0f;--panel:#12121a;--border:#2a2a3a;--accent:#00ff88;--accent-dim:#00ff8833;--text:#e0e0e0;--dim:#888;--code-bg:#1a1a24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-shrink:0}
header h1{font-size:18px;color:var(--accent)}
header .ver{font-size:12px;color:var(--dim);background:var(--accent-dim);padding:2px 8px;border-radius:4px}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:280px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.sidebar input{width:100%;padding:10px 14px;background:var(--panel);border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:13px;outline:none}
.sidebar input::placeholder{color:var(--dim)}
.plist{list-style:none}
.pi{padding:8px 14px;cursor:pointer;font-size:13px;border-left:3px solid transparent;transition:all .15s;display:flex;justify-content:space-between;align-items:center}
.pi:hover{background:var(--accent-dim)}
.pi.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}
.cat-tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:bold}
.cat-core{background:#00ff8833;color:#00ff88}
.cat-A{background:#ff444433;color:#ff6666}
.cat-B{background:#ff880033;color:#ffaa44}
.cat-C{background:#4488ff33;color:#66aaff}
.cat-D{background:#aa44ff33;color:#cc88ff}
.cat-E{background:#ffff0033;color:#ffff66}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.demo-area{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-height:300px}
.demo-area canvas{border:1px solid var(--border);image-rendering:pixelated}
.demo-overlay{position:absolute;top:10px;right:10px;font-size:11px;color:var(--dim);pointer-events:none}
.code-panel{height:280px;border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.code-tabs{display:flex;border-bottom:1px solid var(--border)}
.code-tab{padding:8px 16px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--dim)}
.code-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.code-content{flex:1;overflow:auto;padding:14px;background:var(--code-bg)}
.code-content pre{font-family:'Cascadia Code','Fira Code',monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#c0c0d0}
.kw{color:#cc77ff}.fn{color:#66ccff}.str{color:#88ff88}.num{color:#ffaa44}.cmt{color:#666;font-style:italic}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
@media(max-width:768px){.main{flex-direction:column}.sidebar{width:100%;height:200px;border-right:none;border-bottom:1px solid var(--border)}.code-panel{height:200px}}
</style>
</head>
<body>
<header>
<h1>⚡ RAKITRAKATRA V4.2.1</h1>
<span class="ver">85 Plugins • Teny Gasy • WebGL2</span>
</header>
<div class="main">
<div class="sidebar">
<input type="text" id="searchInput" placeholder="🔍 Hitady plugin...">
<ul class="plist" id="pluginList"></ul>
</div>
<div class="content">
<div class="demo-area">
<canvas id="demoCanvas" width="640" height="400"></canvas>
<div class="demo-overlay" id="demoOverlay">FPS: --</div>
</div>
<div class="code-panel">
<div class="code-tabs">
<div class="code-tab active" data-tab="usage">📖 Fampiasana</div>
<div class="code-tab" data-tab="api">📋 API Reference</div>
</div>
<div class="code-content">
<pre id="codeDisplay"><span class="cmt">// Safidio ny plugin iray ao amin'ny lisitra havia...</span></pre>
</div>
</div>
</div>
</div>

<script src="rakitrakatra.js"></script>
<script>
// ============================================================
// PLUGIN REGISTRY — 85 plugins, ZERO template literals
// ============================================================
var PLUGINS = [
{id:'Vektora2',name:'Vektora2',cat:'core',desc:'Vecteur 2D optimized',
usage:'var v = new R.Vektora2(10, 20);\nv.add(new R.Vektora2(5, 3));\nconsole.log(v.x, v.y); // 15, 23\nv.normalize();\nvar d = R.Vektora2.distance(a, b);',
demo:function(ctx,w,h,t){var cx=w/2,cy=h/2;for(var i=0;i<8;i++){var a=(i/8)*Math.PI*2+t;var vx=Math.cos(a)*100,vy=Math.sin(a)*100;ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+vx,cy+vy);ctx.stroke();ctx.fillStyle='#00ff88';ctx.beginPath();ctx.arc(cx+vx,cy+vy,4,0,Math.PI*2);ctx.fill();}}},

{id:'Efajoro',name:'Efajoro',cat:'core',desc:'Rectangle AABB collision',
usage:'var r = new R.Efajoro(10, 20, 100, 50);\nconsole.log(r.left, r.right, r.cx);\nif (r.intersects(other)) {\n  var overlap = r.intersection(other);\n}',
demo:function(ctx,w,h,t){var x1=w/2-60+Math.sin(t)*40,y1=h/2-30;var x2=w/2-20,y2=h/2-40+Math.cos(t*1.3)*30;ctx.strokeStyle='#00ff88';ctx.strokeRect(x1,y1,80,60);ctx.strokeStyle='#ff4444';ctx.strokeRect(x2,y2,60,80);var ox=Math.max(x1,x2),oy=Math.max(y1,y2);var ow=Math.min(x1+80,x2+60)-ox,oh=Math.min(y1+60,y2+80)-oy;if(ow>0&&oh>0){ctx.fillStyle='rgba(255,255,0,0.3)';ctx.fillRect(ox,oy,ow,oh);}}},

{id:'Boribory',name:'Boribory',cat:'core',desc:'Circle collision detection',
usage:'var c = new R.Boribory(100, 100, 30);\nif (c.contains(mx, my)) console.log("Inside!");\nif (c.intersects(otherCircle)) { /* hit */ }',
demo:function(ctx,w,h,t){var x1=w/2+Math.sin(t)*80,y1=h/2,r1=30;var x2=w/2-Math.sin(t)*80,y2=h/2,r2=25;ctx.beginPath();ctx.arc(x1,y1,r1,0,Math.PI*2);ctx.strokeStyle='#00ff88';ctx.stroke();ctx.beginPath();ctx.arc(x2,y2,r2,0,Math.PI*2);ctx.strokeStyle='#ff4444';ctx.stroke();var dx=x2-x1,dy=y2-y1;if(dx*dx+dy*dy<=(r1+r2)*(r1+r2)){ctx.fillStyle='rgba(255,255,0,0.4)';ctx.beginPath();ctx.arc((x1+x2)/2,(y1+y2)/2,10,0,Math.PI*2);ctx.fill();}}},

{id:'Lamina2D',name:'Lamina2D',cat:'core',desc:'Matrice 2D transform',
usage:'var m = new R.Lamina2D();\nm.translate(100, 50);\nm.rotate(Math.PI / 4);\nm.scale(2, 2);\nvar p = m.transformPoint(10, 0);',
demo:function(ctx,w,h,t){var cx=w/2,cy=h/2;var sc=1+Math.sin(t*2)*0.3;ctx.save();ctx.translate(cx,cy);ctx.rotate(t);ctx.scale(sc,sc);ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.strokeRect(-40,-40,80,80);ctx.fillStyle='#00ff8833';ctx.fillRect(-40,-40,80,80);ctx.restore();}},

{id:'Z',name:'Z Utils',cat:'core',desc:'Fitahirizana fonctions utilitaires',
usage:'R.Z.lerp(0, 100, 0.5);     // 50\nR.Z.clamp(150, 0, 100);    // 100\nR.Z.rand(10, 20);\nR.Z.shuffle([1,2,3,4]);\nR.Z.uuid();',
demo:function(ctx,w,h,t){for(var i=0;i<20;i++){var x=20+Math.random()*(w-40);var y=h*0.3+(h*0.4)*((Math.sin(t+i*0.5)+1)/2);var s=3+Math.abs(Math.sin(t*2+i))*7;ctx.fillStyle='hsl('+(i*18)+',80%,60%)';ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();}}},

{id:'Vondrona',name:'Vondrona (ECS)',cat:'core',desc:'Entity Component System SoA',
usage:'var ecs = new R.Vondrona(1000);\nvar id = ecs.create();\necs.x[id] = 100;\necs.y[id] = 200;\necs.hp[id] = 50;\necs.setTag(id, 1);\necs.query(1, function(eid) {\n  console.log(ecs.x[eid]);\n});\necs.destroy(id);',
demo:function(ctx,w,h,t){if(!this._e){this._e=new R.Vondrona(500);for(var i=0;i<100;i++){var id=this._e.create();this._e.x[id]=Math.random()*640;this._e.y[id]=Math.random()*400;this._e.vx[id]=(Math.random()-0.5)*60;this._e.vy[id]=(Math.random()-0.5)*60;}}var e=this._e,dt=0.016;e.forEach(function(id){e.x[id]+=e.vx[id]*dt;e.y[id]+=e.vy[id]*dt;if(e.x[id]<0||e.x[id]>640)e.vx[id]*=-1;if(e.y[id]<0||e.y[id]>400)e.vy[id]*=-1;});e.forEach(function(id){ctx.fillStyle='#00ff88';ctx.fillRect(e.x[id]-2,e.y[id]-2,4,4);});}},

{id:'SakanToerana',name:'SakanToerana',cat:'core',desc:'Spatial Hash Grid O(n)',
usage:'var grid = new R.SakanToerana(64);\ngrid.insert(entityId, x, y, w, h);\nvar found = grid.query(rx, ry, rw, rh);\nfor (var id of found) { /* check */ }',
demo:function(ctx,w,h,t){var grid=new R.SakanToerana(64);var ents=[];for(var i=0;i<50;i++){var ex=Math.random()*640,ey=Math.random()*400;ents.push({x:ex,y:ey,w:8,h:8});grid.insert(i,ex,ey,8,8);}var qx=w/2-50+Math.sin(t)*100,qy=h/2-50+Math.cos(t*0.7)*80;var found=grid.query(qx,qy,100,100);ctx.strokeStyle='#222';for(var x=0;x<w;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}for(var y=0;y<h;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}for(var i=0;i<ents.length;i++){ctx.fillStyle=found.has(i)?'#ffff00':'#00ff8844';ctx.fillRect(ents[i].x,ents[i].y,8,8);}ctx.strokeStyle='#ff4444';ctx.lineWidth=2;ctx.strokeRect(qx,qy,100,100);}},

{id:'Mpampiseho',name:'Mpampiseho',cat:'core',desc:'WebGL2 Batched Renderer',
usage:'renderer.begin(camera);\nrenderer.drawSprite(x,y,w,h, sx,sy,sw,sh, color, "texKey");\nrenderer.drawRect(x,y,w,h, 0xFFFF00FF);\nrenderer.end();',
demo:function(ctx,w,h,t){for(var i=0;i<200;i++){var x=(i*37+t*50)%w;var y=(i*53+Math.sin(t+i)*30)%h;ctx.fillStyle='hsla('+(i*3)+',70%,60%,0.7)';ctx.fillRect(x,y,6,6);}}},

{id:'Kamera',name:'Kamera',cat:'core',desc:'Camera follow/shake/deadzone',
usage:'var cam = new R.Kamera(800, 600);\ncam.follow(player, 0.1);\ncam.setBounds(0, 0, 2000, 1500);\ncam.shake(10, 300);\ncam.update(dtMs);\nvar world = cam.screenToWorld(mx, my);',
demo:function(ctx,w,h,t){ctx.fillStyle='#1a1a24';for(var x=0;x<w;x+=40)for(var y=0;y<h;y+=40){ctx.fillRect(x+Math.sin(t+x*0.01)*5,y+Math.cos(t+y*0.01)*5,2,2);}var cx=w/2+Math.sin(t)*100,cy=h/2+Math.cos(t*0.7)*80;ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.strokeRect(cx-15,cy-15,30,30);ctx.fillStyle='#00ff8833';ctx.font='11px monospace';ctx.fillText('camera target',cx-35,cy+30);}},

{id:'Fanindry',name:'Fanindry',cat:'core',desc:'Input keyboard/mouse/touch/gamepad',
usage:'R.Fanindry.init(canvas);\nif (R.Fanindry.isDown("arrowright")) moveRight();\nif (R.Fanindry.justPressed(" ")) jump();\nif (R.Fanindry.mouseJustDown(0)) shoot();\nvar axis = R.Fanindry.axis();',
demo:function(ctx,w,h,t){var keys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'];for(var i=0;i<keys.length;i++){var k=keys[i];var down=R&&R.Fanindry&&R.Fanindry.keys&&R.Fanindry.keys.has(k.toLowerCase());ctx.fillStyle=down?'#00ff88':'#333';ctx.fillRect(w/2-120+i*50,h/2-20,40,40);ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.fillText(k.slice(0,4),w/2-118+i*50,h/2+5);}ctx.fillStyle='#888';ctx.font='12px sans-serif';ctx.fillText('Tsindrio ny kitendry...',w/2-80,h/2+50);}},

{id:'FitaovanaVoa',name:'FitaovanaVoa',cat:'A',desc:'Hitbox/Hurtbox + Spatial Hash ✅ FIXED',
usage:'var combat = new R.FitaovanaVoa(64);\ncombat.addHitbox(attacker, {x:x,y:y,w:40,h:40}, 10, 0);\ncombat.addHurtbox(victim, {x:x,y:y,w:30,h:30}, 1);\ncombat.update(function(hit, hurt) {\n  console.log("Hit!", hit.damage);\n});',
demo:function(ctx,w,h,t){var combat=new R.FitaovanaVoa(64);var hx=w/2-30+Math.sin(t*2)*60,hy=h/2-20;combat.addHitbox({},{x:hx,y:hy,w:40,h:40},10,0);combat.addHurtbox({},{x:w/2-10,y:h/2-10,w:30,h:30},1);var hit=false;combat.update(function(){hit=true;});ctx.fillStyle=hit?'#ff4444':'#00ff8844';ctx.fillRect(hx,hy,40,40);ctx.fillStyle='#4488ff';ctx.fillRect(w/2-10,h/2-10,30,30);if(hit){ctx.fillStyle='#ffff00';ctx.font='bold 20px sans-serif';ctx.fillText('HIT!',w/2+30,h/2-20);}ctx.fillStyle='#888';ctx.font='11px monospace';ctx.fillText('Team 0 vs Team 1',10,h-10);}},

{id:'FitahirizanaBaiko',name:'FitahirizanaBaiko',cat:'A',desc:'Input Buffer + Coyote Time',
usage:'var input = new R.FitahirizanaBaiko(0.15, 0.1);\ninput.press("jump");\nif (input.consume("jump")) doJump();\ninput.setGrounded(onGround);\nif (input.canCoyote()) canStillJump = true;',
demo:function(ctx,w,h,t){var phase=(t%2)/2;var pressed=phase>0.3&&phase<0.35;var consumed=phase>0.3&&phase<0.5;ctx.fillStyle='#333';ctx.fillRect(w/2-150,h/2-10,300,20);ctx.fillStyle=pressed?'#00ff88':consumed?'#ffff0066':'#222';ctx.fillRect(w/2-150,h/2-10,300*phase,20);ctx.fillStyle='#fff';ctx.font='11px monospace';ctx.fillText(pressed?'PRESS':'buffer window',w/2-40,h/2-20);ctx.fillText('coyote: 0.15s',w/2-40,h/2+30);}},

{id:'Fiadiana',name:'Fiadiana',cat:'A',desc:'Weapon arsenal/cooldown/reload',
usage:'var arsenal = new R.Fiadiana([\n  {name:"Pistol",ammo:12,maxAmmo:12,cooldown:0.3,reloadTime:1.5}\n]);\nif (arsenal.canFire()) arsenal.fire();\narsenal.reload();\narsenal.update(dt);',
demo:function(ctx,w,h,t){var wp={name:'Pistol',ammo:12,max:12};var ammoLeft=Math.max(0,wp.ammo-Math.floor((t%3)*3));ctx.fillStyle='#222';ctx.fillRect(w/2-100,h/2-30,200,60);ctx.fillStyle='#00ff88';ctx.font='bold 14px monospace';ctx.fillText(wp.name,w/2-80,h/2-10);ctx.fillStyle=ammoLeft>3?'#00ff88':'#ff4444';ctx.fillRect(w/2-80,h/2+5,160*(ammoLeft/wp.max),12);ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.fillText(ammoLeft+'/'+wp.max,w/2-80,h/2+28);}},

{id:'AndroAlina',name:'AndroAlina',cat:'A',desc:'Day/Night cycle ✅ FIXED phase',
usage:'R.AndroAlina.update(dt);\nvar tint = R.AndroAlina.tint();\nif (R.AndroAlina.isNight()) activateNightVision();\nR.AndroAlina.setTime(0.5); // noon',
demo:function(ctx,w,h,t){R.AndroAlina._t=(t*10)%R.AndroAlina.dayLength;var p=R.AndroAlina.phase();var nightAmount=0.5+0.5*Math.cos((p-0.5)*Math.PI*2);var brightness=1-nightAmount*0.6;var grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'rgb('+(30+brightness*100)+','+(40+brightness*140)+','+(80+brightness*175)+')');grad.addColorStop(1,'rgb('+(20+brightness*60)+','+(30+brightness*80)+','+(50+brightness*100)+')');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);var sunY=h*0.2+Math.sin((p-0.5)*Math.PI*2)*h*0.3;ctx.fillStyle=p>0.2&&p<0.7?'#ffdd44':'#ddeeff';ctx.beginPath();ctx.arc(w*0.7,sunY,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(5,5,25,'+(nightAmount*0.6)+')';ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.fillText('Phase: '+(p*100).toFixed(0)+'% | Night: '+R.AndroAlina.isNight(),10,h-10);}},

{id:'BokotraVirtoaly',name:'BokotraVirtoaly',cat:'A',desc:'Custom virtual buttons ABXY',
usage:'var btn = new R.BokotraVirtoaly();\nbtn.define("fire");\nbtn.press("fire");\nif (btn.justPressed("fire")) shoot();\nbtn.endFrame();',
demo:function(ctx,w,h,t){var labels=['A','B','X','Y'];var colors=['#44ff44','#ff4444','#4488ff','#ffff44'];for(var i=0;i<4;i++){var active=Math.sin(t*3+i)>0.5;var bx=w/2+Math.cos(i*Math.PI/2)*60;var by=h/2+Math.sin(i*Math.PI/2)*60;ctx.beginPath();ctx.arc(bx,by,25,0,Math.PI*2);ctx.fillStyle=active?colors[i]:colors[i]+'44';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(labels[i],bx,by+6);}ctx.textAlign='left';}},

{id:'FaribolanaMihena',name:'FaribolanaMihena',cat:'B',desc:'BR shrinking zone',
usage:'var zone = new R.FaribolanaMihena(cx,cy,500,50,120,5);\nzone.update(dt);\nvar dmg = zone.damageIfOutside(px,py,dt);\nconsole.log(zone.radius, zone.progress());',
demo:function(ctx,w,h,t){var progress=(t%10)/10;var radius=180-(180-30)*progress;ctx.fillStyle='rgba(255,0,0,0.15)';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(w/2,h/2,radius,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.beginPath();ctx.arc(w/2,h/2,radius,0,Math.PI*2);ctx.strokeStyle='#ff4444';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='11px monospace';ctx.fillText('Radius: '+radius.toFixed(0)+' | Progress: '+(progress*100).toFixed(0)+'%',10,h-10);}},

{id:'EndrikaBala',name:'EndrikaBala',cat:'B',desc:'Bullet hell patterns',
usage:'var bullets = R.EndrikaBala.spiral(12, timeOffset, 200);\nbullets.forEach(function(b) {\n  spawnBullet(x, y, b.angle, b.speed);\n});\nvar aimed = R.EndrikaBala.aimed(ex,ey,px,py,300);',
demo:function(ctx,w,h,t){var patterns=['spiral','wave','burst'];var pat=patterns[Math.floor(t/3)%3];var bullets;if(pat==='spiral'){bullets=[];for(var i=0;i<12;i++)bullets.push({angle:t*2+i*Math.PI*2/12});}else if(pat==='wave'){bullets=[];for(var i=0;i<8;i++){var tt=i/7-0.5;bullets.push({angle:t*0.5+tt*1.0});}}else{bullets=[];for(var i=0;i<16;i++)bullets.push({angle:t+(Math.random()-0.5)*0.8});}for(var i=0;i<bullets.length;i++){var dist=((t*100)%150);var bx=w/2+Math.cos(bullets[i].angle)*dist;var by=h/2+Math.sin(bullets[i].angle)*dist;if(dist<150){ctx.fillStyle='#ffff44';ctx.beginPath();ctx.arc(bx,by,3,0,Math.PI*2);ctx.fill();}}ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.fillText('Pattern: '+pat,10,h-10);}},

{id:'Fisintonana',name:'Fisintonana',cat:'B',desc:'Dash + i-frames',
usage:'var dash = new R.Fisintonana(120, 0.18, 0.25, 0.8);\nif (dashBtn && dash.canDash()) dash.start(dirX, dirY);\nvar move = dash.update(dt);\nplayer.x += move.dx;\nif (dash.isInvincible) ignoreDamage();',
demo:function(ctx,w,h,t){var cycle=t%2;var px=w/4+(cycle>0.1&&cycle<0.5?(cycle-0.1)*375:0);var inv=cycle>=0.1&&cycle<0.35;ctx.fillStyle=inv?'rgba(255,255,255,0.5)':'#00ff88';ctx.fillRect(px-10,h/2-10,20,20);if(inv){ctx.strokeStyle='#fff';ctx.setLineDash([4,4]);ctx.strokeRect(px-12,h/2-12,24,24);ctx.setLineDash([]);}ctx.fillStyle='#888';ctx.font='11px monospace';ctx.fillText('iFrames: '+inv+' | Dash active: '+(cycle>0.1&&cycle<0.5),10,h-10);}},

{id:'IsaMitohy',name:'IsaMitohy',cat:'B',desc:'Combo counter & multiplier',
usage:'var combo = new R.IsaMitohy(1.5);\nvar score = combo.add(100);\nconsole.log(combo.combo, combo.multiplier);\ncombo.update(dt);\ncombo.reset();',
demo:function(ctx,w,h,t){var hits=Math.floor(t*3)%20;var mult=1+Math.floor(hits/5)*0.5;ctx.fillStyle='#00ff88';ctx.font='bold 40px sans-serif';ctx.textAlign='center';ctx.fillText(hits+' HITS',w/2,h/2-20);ctx.fillStyle='#ffff44';ctx.font='bold 24px sans-serif';ctx.fillText('x'+mult.toFixed(1),w/2,h/2+20);ctx.textAlign='left';}},

{id:'TantaraFandresena',name:'TantaraFandresena',cat:'B',desc:'Kill feed & leaderboard',
usage:'var feed = new R.TantaraFandresena(5, 10);\nfeed.addKill("Player1", "Enemy3");\nfeed.addScore("Player1", 50);\nvar ranking = feed.ranking();',

// ============================================================
// APP LOGIC
// ============================================================
var currentPlugin = null;
var demoAnimId = null;
var demoStartTime = 0;
var activeTab = 'usage';

function buildSidebar(filter) {
    var list = document.getElementById('pluginList');
    list.innerHTML = '';
    var f = (filter || '').toLowerCase();
    for (var p = 0; p < PLUGINS.length; p++) {
        var pl = PLUGINS[p];
        if (f && pl.name.toLowerCase().indexOf(f) === -1 && pl.desc.toLowerCase().indexOf(f) === -1 && pl.cat.toLowerCase().indexOf(f) === -1) continue;
        var li = document.createElement('li');
        li.className = 'pi' + (currentPlugin && currentPlugin.id === pl.id ? ' active' : '');
        var catClass = pl.cat === 'core' ? 'cat-core' : 'cat-' + pl.cat;
        li.innerHTML = '<span>' + pl.name + '</span><span class="cat-tag ' + catClass + '">' + pl.cat + '</span>';
        li.setAttribute('data-idx', p);
        li.onclick = function() { selectPlugin(PLUGINS[parseInt(this.getAttribute('data-idx'))]); };
        list.appendChild(li);
    }
}

function selectPlugin(plugin) {
    currentPlugin = plugin;
    buildSidebar(document.getElementById('searchInput').value);
    updateCodeDisplay();
    startDemo();
}

function updateCodeDisplay() {
    if (!currentPlugin) return;
    var el = document.getElementById('codeDisplay');
    if (activeTab === 'usage') {
        el.innerHTML = highlightCode('// ' + currentPlugin.name + ' — ' + currentPlugin.desc + '\n\n' + currentPlugin.usage);
    } else {
        el.innerHTML = highlightCode('// API: R.' + currentPlugin.id + '\n// Category: ' + currentPlugin.cat + '\n// Description: ' + currentPlugin.desc + '\n\n// See usage tab for examples.\n// All APIs accessible via R. namespace');
    }
}

function highlightCode(code) {
    return code
        .replace(/\/\/.*$/gm, function(m) { return '<span class="cmt">' + m + '</span>'; })
        .replace(/\b(var|new|return|if|else|for|while|function|this|true|false|null)\b/g, '<span class="kw">$1</span>')
        .replace(/\b(R\.\w+)\b/g, '<span class="fn">$1</span>')
        .replace(/'[^']*'/g, function(m) { return '<span class="str">' + m + '</span>'; })
        .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
}

function startDemo() {
    if (demoAnimId) cancelAnimationFrame(demoAnimId);
    var canvas = document.getElementById('demoCanvas');
    var ctx = canvas.getContext('2d');
    demoStartTime = performance.now();
    var lastFrame = demoStartTime;
    var frameCount = 0;

    function loop(now) {
        frameCount++;
        var t = (now - demoStartTime) / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (currentPlugin && currentPlugin.demo) {
            try {
                currentPlugin.demo.call({}, ctx, canvas.width, canvas.height, t);
            } catch(e) {
                ctx.fillStyle = '#ff4444';
                ctx.font = '14px monospace';
                ctx.fillText('Error: ' + e.message, 20, 40);
            }
        }

        if (frameCount % 30 === 0) {
            var fps = Math.round(1000 / ((now - lastFrame) / 30));
            document.getElementById('demoOverlay').textContent = 'FPS: ' + fps + ' | t=' + t.toFixed(1) + 's';
            lastFrame = now;
            frameCount = 0;
        }

        demoAnimId = requestAnimationFrame(loop);
    }
    loop(performance.now());
}

// Tab switching
var tabs = document.querySelectorAll('.code-tab');
for (var i = 0; i < tabs.length; i++) {
    tabs[i].onclick = function() {
        for (var j = 0; j < tabs.length; j++) tabs[j].className = 'code-tab';
        this.className = 'code-tab active';
        activeTab = this.getAttribute('data-tab');
        updateCodeDisplay();
    };
}

// Search
document.getElementById('searchInput').oninput = function() {
    buildSidebar(this.value);
};

// Init
buildSidebar();
selectPlugin(PLUGINS[0]);


</script>
