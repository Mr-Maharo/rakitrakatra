<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rakitrakatra V4 · Survival Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            background: #0d0d16;
            cursor: crosshair;
        }
        #ui {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
            letter-spacing: 1px;
            text-align: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }
        #ui span {
            color: rgba(255, 200, 100, 0.6);
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            color: #44aaff;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            flex-direction: column;
            gap: 20px;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(68, 170, 255, 0.1);
            border-top-color: #44aaff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @media (max-width: 600px) {
            #ui {
                font-size: 10px;
                padding: 4px 12px;
                bottom: 8px;
            }
            #loading {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>⏳ Mampiditra motera...</div>
    </div>

    <div id="ui">⬆ ⬇ ⬅ ➡ &nbsp;·&nbsp; <span>clic / tap</span> &nbsp;·&nbsp; tire</div>

    <script>
        // ═══════════════════════════════════════════════════════════
        //  LOADER : Mampiditra ny motera avy amin'ny rakitra ivelany
        // ═══════════════════════════════════════════════════════════

        (function() {
            const loadingEl = document.getElementById('loading');

            // 1. Mamorona script tag ho an'ny motera
            const script = document.createElement('script');
            script.src = 'rakitrakatra.js'; // Ilay rakitra motera
            script.async = false;

            // 2. Rehefa vita ny loading
            script.onload = function() {
                console.log('✅ Moteur Rakitrakatra V4 tafiditra!');

                // Esory ny loading screen
                loadingEl.style.opacity = '0';
                setTimeout(() => {
                    loadingEl.style.display = 'none';
                }, 400);

                // Atombohy ny lalao
                if (typeof R !== 'undefined') {
                    startGame();
                } else {
                    console.error('❌ Tsy hita ny R (moteur)');
                    loadingEl.innerHTML =
                        '<div style="color:#ff4466;">❌ Erreur: moteur tsy hita</div>';
                }
            };

            // 3. Raha misy erreur
            script.onerror = function() {
                console.error('❌ Tsy voarindra ny rakitra motera!');
                loadingEl.innerHTML = `
                            <div style="color:#ff4466;text-align:center;line-height:1.6;">
                                ❌ Tsy hita ny rakitra <strong>rakitrakatra.js</strong><br>
                                <small style="font-size:14px;color:#888;">
                                    Apetraho amin'ny folder mitovy io rakitra io.
                                </small>
                            </div>
                        `;
            };

            // 4. Ampidiro ao amin'ny page
            document.head.appendChild(script);

            // ═══════════════════════════════════════════════════════
            //  LALAO : Survival Arena
            // ═══════════════════════════════════════════════════════
            function startGame() {
                const {
                    Lalao,
                    Sehatra,
                    Vec2,
                    Z,
                    Fanindry,
                    Feo,
                    UI,
                    Fizika,
                    Vovoka,
                    MpitantanaTween,
                    Mpanamora
                } = R;

                // ====================================================
                //  1. SCÈNE DU JEU
                // ====================================================
                class SurvivalArena extends Sehatra {
                    constructor(key) {
                        super(key);
                        this.score = 0;
                        this.wave = 0;
                        this.enemyCount = 0;
                        this.maxEnemies = 20;
                        this.spawnTimer = 0;
                        this.spawnInterval = 1.2;
                        this.playerId = -1;
                        this.enemyIds = [];
                        this.projectileIds = [];
                        this.particleSystem = null;
                        this.healthBar = null;
                        this.gameOver = false;
                        this.gameOverTimer = 0;
                        this.shootCooldown = 0;
                        this.shootDelay = 0.18;
                        this.waveTimer = 0;
                    }

                    init(data) {
                        this.score = 0;
                        this.wave = 0;
                        this.enemyCount = 0;
                        this.gameOver = false;
                        this.gameOverTimer = 0;
                        this.shootCooldown = 0;
                        this.enemyIds = [];
                        this.projectileIds = [];
                        this.spawnTimer = 0;
                        this.spawnInterval = 1.2;
                        this.waveTimer = 0;
                    }

                    create() {
                        const ecs = this.game.ecs;
                        const camera = this.game.camera;
                        const renderer = this.game.renderer;

                        // --- Joueur ---
                        this.playerId = ecs.create();
                        const p = this.playerId;
                        ecs.x[p] = 400;
                        ecs.y[p] = 300;
                        ecs.w[p] = 36;
                        ecs.h[p] = 36;
                        ecs.vx[p] = 0;
                        ecs.vy[p] = 0;
                        ecs.color[p] = 0xFF44AAFF;
                        ecs.alpha[p] = 1;
                        ecs.hp[p] = 100;
                        ecs.maxHp[p] = 100;
                        ecs.mass[p] = 1;
                        ecs.isSolid[p] = 1;
                        ecs.tag[p] = 1;

                        // --- Caméra ---
                        camera.follow(ecs, p, 0.08);
                        camera.setBounds(-100, -100, 1600, 1200);
                        camera.zoom = 1;

                        // --- Système de particules ---
                        this.particleSystem = new Vovoka(5000);

                        // --- UI ---
                        this.healthBar = new UI.Bara(20, 20, 200, 18, {
                            max: 100,
                            value: 100,
                            bgColor: 0xCC222244,
                            fillColor: 0xFF44FF44
                        });

                        // --- Premiers ennemis ---
                        for (let i = 0; i < 4; i++) {
                            this.spawnEnemy();
                        }

                        // --- Vagues automatiques ---
                        this.game.timer.every(6000, () => {
                            if (!this.gameOver) {
                                this.wave++;
                                this.spawnInterval = Math.max(0.35, 1.2 - this.wave * 0.04);
                                for (let i = 0; i < Math.min(3 + this.wave, 8); i++) {
                                    this.spawnEnemy();
                                }
                                this.game.camera.shake(4, 150);
                                Feo.mamorona('power');
                            }
                        });
                    }

                    spawnEnemy() {
                        const ecs = this.game.ecs;
                        const camera = this.game.camera;

                        if (this.enemyIds.length >= this.maxEnemies + this.wave * 2) return;

                        const cam = camera.getBounds();
                        const side = Math.floor(Math.random() * 4);
                        let x, y;
                        const cx = cam.x + cam.w / 2;
                        const cy = cam.y + cam.h / 2;
                        const halfW = cam.w / 2 + 120;
                        const halfH = cam.h / 2 + 120;

                        switch (side) {
                            case 0:
                                x = cx - halfW + Math.random() * 60;
                                y = cy - halfH + Math.random() * 30 - 15;
                                break;
                            case 1:
                                x = cx + halfW - 60 + Math.random() * 60;
                                y = cy - halfH + Math.random() * 30 - 15;
                                break;
                            case 2:
                                x = cx - halfW + Math.random() * 30 - 15;
                                y = cy - halfH + Math.random() * 60;
                                break;
                            case 3:
                                x = cx - halfW + Math.random() * 30 - 15;
                                y = cy + halfH - 60 + Math.random() * 60;
                                break;
                        }

                        x = Z.clamp(x, -50, 1600);
                        y = Z.clamp(y, -50, 1200);

                        const id = ecs.create();
                        const size = 20 + Math.random() * 16 + Math.min(this.wave * 0.5, 8);
                        ecs.x[id] = x;
                        ecs.y[id] = y;
                        ecs.w[id] = size;
                        ecs.h[id] = size;
                        ecs.vx[id] = 0;
                        ecs.vy[id] = 0;
                        ecs.color[id] = 0xFFFF6644;
                        ecs.alpha[id] = 1;
                        ecs.hp[id] = 1 + Math.floor(this.wave / 3);
                        ecs.maxHp[id] = ecs.hp[id];
                        ecs.mass[id] = 0.5;
                        ecs.isSolid[id] = 1;
                        ecs.tag[id] = 2;
                        ecs._maxSpeed = Math.min(60 + this.wave * 4, 220);
                        ecs._damage = 8 + Math.floor(this.wave / 2);

                        this.enemyIds.push(id);
                        this.enemyCount++;
                    }

                    shoot(targetX, targetY) {
                        if (this.gameOver) return;
                        if (this.shootCooldown > 0) return;
                        if (this.playerId < 0 || !this.game.ecs.isAlive(this.playerId)) return;

                        const ecs = this.game.ecs;
                        const p = this.playerId;
                        const px = ecs.x[p] + ecs.w[p] / 2;
                        const py = ecs.y[p] + ecs.h[p] / 2;

                        const angle = Math.atan2(targetY - py, targetX - px);
                        const speed = 420;

                        const id = ecs.create();
                        ecs.x[id] = px;
                        ecs.y[id] = py;
                        ecs.w[id] = 8;
                        ecs.h[id] = 8;
                        ecs.vx[id] = Math.cos(angle) * speed;
                        ecs.vy[id] = Math.sin(angle) * speed;
                        ecs.color[id] = 0xFF44FF88;
                        ecs.alpha[id] = 1;
                        ecs.hp[id] = 1;
                        ecs.tag[id] = 3;
                        ecs.lifetime[id] = 1.8;

                        this.projectileIds.push(id);
                        this.shootCooldown = this.shootDelay;
                        Feo.mamorona('laser');

                        for (let i = 0; i < 6; i++) {
                            const a = angle + (Math.random() - 0.5) * 0.8;
                            const s = 60 + Math.random() * 80;
                            this.particleSystem.emit(px, py, {
                                count: 1,
                                speedMin: s * 0.5,
                                speedMax: s,
                                angle: a,
                                angleSpread: 0.3,
                                lifeMin: 0.15,
                                lifeMax: 0.35,
                                sizeStart: 3,
                                sizeEnd: 0,
                                color: 0xFF44FF88,
                                gravity: 0
                            });
                        }
                    }

                    update(dt, dtMs) {
                        if (this.gameOver) {
                            this.gameOverTimer += dt;
                            if (this.gameOverTimer > 1.5 && Fanindry.justPressed(' ')) {
                                this.restartGame();
                            }
                            return;
                        }

                        const ecs = this.game.ecs;
                        const camera = this.game.camera;
                        const dtF = dt;

                        if (this.shootCooldown > 0) this.shootCooldown -= dt;

                        // --- Mouvement joueur ---
                        const p = this.playerId;
                        if (ecs.isAlive(p)) {
                            const axis = Fanindry.axis();
                            const speed = 200;
                            const targetVx = axis.x * speed;
                            const targetVy = axis.y * speed;
                            ecs.vx[p] = Z.approach(ecs.vx[p], targetVx, 800 * dt);
                            ecs.vy[p] = Z.approach(ecs.vy[p], targetVy, 800 * dt);

                            const maxSpd = 250;
                            const spd = Math.hypot(ecs.vx[p], ecs.vy[p]);
                            if (spd > maxSpd) {
                                ecs.vx[p] = (ecs.vx[p] / spd) * maxSpd;
                                ecs.vy[p] = (ecs.vy[p] / spd) * maxSpd;
                            }

                            ecs.x[p] = Z.clamp(ecs.x[p] + ecs.vx[p] * dt, 20, 1580);
                            ecs.y[p] = Z.clamp(ecs.y[p] + ecs.vy[p] * dt, 20, 1180);

                            // Tir
                            const mx = Fanindry.mouse.worldX;
                            const my = Fanindry.mouse.worldY;
                            if (Fanindry.mouse.justDown[0]) {
                                this.shoot(mx, my);
                            }
                            if (Fanindry.justPressed(' ') || Fanindry.justPressed('z')) {
                                const dir = Vec2.fromAngle(Math.atan2(ecs.vy[p], ecs.vx[p]));
                                if (dir.len() > 0.1) {
                                    this.shoot(ecs.x[p] + dir.x * 100, ecs.y[p] + dir.y * 100);
                                } else {
                                    this.shoot(ecs.x[p] + 50, ecs.y[p]);
                                }
                            }

                            this.healthBar.value = ecs.hp[p];
                            this.healthBar.max = ecs.maxHp[p];
                        }

                        // --- IA ennemis ---
                        const playerPos = ecs.isAlive(p) ? { x: ecs.x[p], y: ecs.y[p] } : null;
                        const toRemove = [];
                        for (let i = 0; i < this.enemyIds.length; i++) {
                            const e = this.enemyIds[i];
                            if (!ecs.isAlive(e)) {
                                toRemove.push(i);
                                continue;
                            }

                            if (playerPos) {
                                const dx = playerPos.x - ecs.x[e];
                                const dy = playerPos.y - ecs.y[e];
                                const dist = Math.hypot(dx, dy);
                                if (dist > 1) {
                                    const speed = ecs._maxSpeed || 80;
                                    const accel = 120 + this.wave * 5;
                                    const normX = dx / dist;
                                    const normY = dy / dist;
                                    ecs.vx[e] = Z.approach(ecs.vx[e], normX * speed, accel * dt);
                                    ecs.vy[e] = Z.approach(ecs.vy[e], normY * speed, accel * dt);
                                }
                            }

                            ecs.x[e] = Z.clamp(ecs.x[e] + ecs.vx[e] * dt, 10, 1590);
                            ecs.y[e] = Z.clamp(ecs.y[e] + ecs.vy[e] * dt, 10, 1190);
                        }

                        for (let i = toRemove.length - 1; i >= 0; i--) {
                            this.enemyIds.splice(toRemove[i], 1);
                            this.enemyCount--;
                        }

                        // --- Projectiles ---
                        const projToRemove = [];
                        for (let i = 0; i < this.projectileIds.length; i++) {
                            const pr = this.projectileIds[i];
                            if (!ecs.isAlive(pr)) {
                                projToRemove.push(i);
                                continue;
                            }

                            ecs.x[pr] += ecs.vx[pr] * dt;
                            ecs.y[pr] += ecs.vy[pr] * dt;

                            ecs.lifetime[pr] -= dt;
                            if (ecs.lifetime[pr] <= 0) {
                                ecs.destroy(pr);
                                projToRemove.push(i);
                                continue;
                            }

                            if (ecs.x[pr] < -50 || ecs.x[pr] > 1650 || ecs.y[pr] < -50 || ecs.y[pr] > 1250) {
                                ecs.destroy(pr);
                                projToRemove.push(i);
                            }
                        }
                        for (let i = projToRemove.length - 1; i >= 0; i--) {
                            this.projectileIds.splice(projToRemove[i], 1);
                        }

                        // --- Collisions projectile → ennemi ---
                        for (const pr of this.projectileIds) {
                            if (!ecs.isAlive(pr)) continue;
                            const px = ecs.x[pr],
                                py = ecs.y[pr];
                            const pw = ecs.w[pr] || 8,
                                ph = ecs.h[pr] || 8;
                            for (const e of this.enemyIds) {
                                if (!ecs.isAlive(e)) continue;
                                if (Fizika.rectVsRect(px, py, pw, ph, ecs.x[e], ecs.y[e], ecs.w[e], ecs.h[e])) {
                                    ecs.hp[e] -= 1;
                                    if (ecs.hp[e] <= 0) {
                                        ecs.destroy(e);
                                        this.score++;
                                        this.enemyCount--;
                                        const cx = ecs.x[e] + ecs.w[e] / 2;
                                        const cy = ecs.y[e] + ecs.h[e] / 2;
                                        for (let j = 0; j < 20; j++) {
                                            const a = Math.random() * Math.PI * 2;
                                            const s = 50 + Math.random() * 120;
                                            this.particleSystem.emit(cx, cy, {
                                                count: 1,
                                                speedMin: s * 0.4,
                                                speedMax: s,
                                                angle: a,
                                                angleSpread: 0.6,
                                                lifeMin: 0.2,
                                                lifeMax: 0.6,
                                                sizeStart: 6 + Math.random() * 6,
                                                sizeEnd: 0,
                                                color: 0xFFFF6644,
                                                gravity: 60
                                            });
                                        }
                                        Feo.mamorona('hit');
                                        this.game.camera.shake(3, 100);

                                        if (Math.random() < 0.12 && ecs.isAlive(this.playerId)) {
                                            ecs.hp[this.playerId] = Math.min(ecs.maxHp[this.playerId],
                                                ecs.hp[this.playerId] + 8);
                                            Feo.mamorona('pickup');
                                        }
                                    }
                                    ecs.destroy(pr);
                                    break;
                                }
                            }
                        }

                        // --- Collisions ennemi → joueur ---
                        if (ecs.isAlive(p)) {
                            const pRect = { x: ecs.x[p], y: ecs.y[p], w: ecs.w[p] || 36, h: ecs.h[p] || 36 };
                            for (const e of this.enemyIds) {
                                if (!ecs.isAlive(e)) continue;
                                if (Fizika.rectVsRect(pRect.x, pRect.y, pRect.w, pRect.h,
                                        ecs.x[e], ecs.y[e], ecs.w[e], ecs.h[e])) {
                                    const dmg = ecs._damage || 10;
                                    ecs.hp[p] -= dmg;
                                    const dx = ecs.x[e] - ecs.x[p];
                                    const dy = ecs.y[e] - ecs.y[p];
                                    const d = Math.hypot(dx, dy) || 1;
                                    ecs.x[e] += (dx / d) * 30;
                                    ecs.y[e] += (dy / d) * 30;
                                    ecs.vx[e] += (dx / d) * 80;
                                    ecs.vy[e] += (dy / d) * 80;
                                    Feo.mamorona('hit');
                                    this.game.camera.shake(5, 120);
                                    for (let j = 0; j < 12; j++) {
                                        const a = Math.random() * Math.PI * 2;
                                        const s = 40 + Math.random() * 80;
                                        this.particleSystem.emit(ecs.x[p] + pRect.w / 2, ecs.y[p] + pRect.h / 2, {
                                            count: 1,
                                            speedMin: s * 0.3,
                                            speedMax: s,
                                            angle: a,
                                            angleSpread: 1,
                                            lifeMin: 0.2,
                                            lifeMax: 0.6,
                                            sizeStart: 5 + Math.random() * 5,
                                            sizeEnd: 0,
                                            color: 0xFFFF4444,
                                            gravity: 40
                                        });
                                    }

                                    if (ecs.hp[p] <= 0) {
                                        ecs.hp[p] = 0;
                                        this.gameOver = true;
                                        this.gameOverTimer = 0;
                                        ecs.alpha[p] = 0.3;
                                        Feo.mamorona('explode');
                                        for (let j = 0; j < 30; j++) {
                                            const a = Math.random() * Math.PI * 2;
                                            const s = 60 + Math.random() * 150;
                                            this.particleSystem.emit(ecs.x[p] + pRect.w / 2, ecs.y[p] + pRect.h / 2, {
                                                count: 1,
                                                speedMin: s * 0.3,
                                                speedMax: s,
                                                angle: a,
                                                angleSpread: 1.2,
                                                lifeMin: 0.3,
                                                lifeMax: 0.9,
                                                sizeStart: 8 + Math.random() * 8,
                                                sizeEnd: 0,
                                                color: 0xFF44AAFF,
                                                gravity: 30
                                            });
                                        }
                                    }
                                    break;
                                }
                            }
                        }

                        // --- Mise à jour particules ---
                        this.particleSystem.update(dt);
                    }

                    restartGame() {
                        this.gameOver = false;
                        this.gameOverTimer = 0;
                        this.score = 0;
                        this.wave = 0;
                        this.enemyCount = 0;
                        this.enemyIds = [];
                        this.projectileIds = [];
                        this.spawnTimer = 0;
                        this.spawnInterval = 1.2;

                        const ecs = this.game.ecs;
                        const p = this.playerId;
                        if (ecs.isAlive(p)) {
                            ecs.hp[p] = ecs.maxHp[p];
                            ecs.x[p] = 400;
                            ecs.y[p] = 300;
                            ecs.vx[p] = 0;
                            ecs.vy[p] = 0;
                            ecs.alpha[p] = 1;
                        } else {
                            this.playerId = ecs.create();
                            const p2 = this.playerId;
                            ecs.x[p2] = 400;
                            ecs.y[p2] = 300;
                            ecs.w[p2] = 36;
                            ecs.h[p2] = 36;
                            ecs.vx[p2] = 0;
                            ecs.vy[p2] = 0;
                            ecs.color[p2] = 0xFF44AAFF;
                            ecs.alpha[p2] = 1;
                            ecs.hp[p2] = 100;
                            ecs.maxHp[p2] = 100;
                            ecs.mass[p2] = 1;
                            ecs.isSolid[p2] = 1;
                            ecs.tag[p2] = 1;
                            this.game.camera.follow(ecs, p2, 0.08);
                        }

                        for (let i = 0; i < 4; i++) {
                            this.spawnEnemy();
                        }

                        this.game.camera.shake(8, 200);
                        Feo.mamorona('power');
                    }

                    render(renderer, camera) {
                        const ecs = this.game.ecs;

                        // Dessiner les entités
                        const allIds = [];
                        if (this.playerId >= 0 && ecs.isAlive(this.playerId)) {
                            allIds.push(this.playerId);
                        }
                        for (const e of this.enemyIds) {
                            if (ecs.isAlive(e)) allIds.push(e);
                        }
                        for (const p of this.projectileIds) {
                            if (ecs.isAlive(p)) allIds.push(p);
                        }

                        for (const id of allIds) {
                            const x = ecs.x[id];
                            const y = ecs.y[id];
                            const w = ecs.w[id] || 20;
                            const h = ecs.h[id] || 20;
                            const color = ecs.color[id] || 0xFFFFFFFF;
                            const alpha = ecs.alpha[id] || 1;

                            // Pack color avec alpha
                            const r = (color >>> 24) & 0xFF;
                            const g = (color >>> 16) & 0xFF;
                            const b = (color >>> 8) & 0xFF;
                            const packedColor = (r << 24) | (g << 16) | (b << 8) | Math.floor(alpha * 255);

                            renderer.drawRect(x, y, w, h, packedColor);

                            // Bordure pour les ennemis
                            if (ecs.tag[id] === 2) {
                                renderer.drawRect(x - 1, y - 1, w + 2, 2, 0x33FF8844);
                                renderer.drawRect(x - 1, y + h, w + 2, 2, 0x33FF8844);
                                renderer.drawRect(x - 1, y, 2, h, 0x33FF8844);
                                renderer.drawRect(x + w - 1, y, 2, h, 0x33FF8844);
                            }
                        }
                    }

                    renderUI(renderer) {
                        // Barre de vie
                        if (this.healthBar) {
                            this.healthBar.render(renderer);
                        }

                        // Score et vague
                        const info = `Score: ${this.score}  ·  Vague: ${this.wave}  ·  Ennemis: ${this.enemyCount}`;
                        renderer.drawRect(20, 50, 300, 24, 0x88000000);
                        // On simule du texte avec des rectangles (pour l'exemple)
                        // Dans la vraie version on utiliserait un système de texte
                        renderer.drawRect(24, 54, 292, 16, 0x44FFFFFF);

                        // Game Over
                        if (this.gameOver) {
                            renderer.drawRect(200, 220, 400, 120, 0xCC000000);
                            renderer.drawRect(210, 230, 380, 100, 0xCCFF2244);
                            // Message
                            const msg = '💀 GAME OVER 💀\nScore: ' + this.score +
                                '\nAppuie sur ESPACE pour recommencer';
                            // Dessin approximatif du texte
                            renderer.drawRect(240, 270, 320, 4, 0xFFFFFFFF);
                            renderer.drawRect(240, 290, 200, 4, 0xFFFFFFFF);
                            renderer.drawRect(240, 310, 280, 4, 0xFFFFFFFF);
                        }
                    }
                }

                // ====================================================
                //  2. LANCEMENT DU JEU
                // ====================================================

                // Créer l'instance du jeu
                const game = new R.Lalao(window.innerWidth, window.innerHeight, {
                    maxEntities: 30000,
                    gameKey: 'survival_arena'
                });

                // Ajouter la scène
                game.addScene('arena', SurvivalArena);

                // Démarrer
                game.start('arena');

                // Redimensionnement
                window.addEventListener('resize', () => {
                    game.renderer.resize(window.innerWidth, window.innerHeight);
                    game.width = window.innerWidth;
                    game.height = window.innerHeight;
                    game.camera.viewW = window.innerWidth;
                    game.camera.viewH = window.innerHeight;
                });

                // Gérer le focus (pour le clavier)
                window.addEventListener('click', () => {
                    if (game.canvas) game.canvas.focus();
                });

                console.log('🎮 Survival Arena lancé !');
            }
        })();
    </script>
