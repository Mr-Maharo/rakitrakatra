<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakitrakatra JS - Plugin Demo Showcase</title>
    <style>
        :root { --bg: #1e1e1e; --sidebar: #252526; --text: #d4d4d4; --accent: #007acc; --code-bg: #101010; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid #333; display: flex; flex-direction: column; }
        #search { padding: 10px; background: #333; border: none; color: white; outline: none; }
        #plugin-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .plugin-item { padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #333; transition: 0.2s; font-size: 14px; }
        .plugin-item:hover { background: #333; color: white; }
        .plugin-item.active { background: var(--accent); color: white; }
        
        /* Main Content */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }
        header { padding: 10px 20px; background: #333; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 18px; color: var(--accent); }
        
        /* Canvas Area */
        #canvas-container { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        canvas { box-shadow: 0 0 20px rgba(0,0,0,0.5); max-width: 100%; max-height: 100%; }
        
        /* Code Panel */
        #code-panel { height: 250px; background: var(--code-bg); border-top: 1px solid #333; display: flex; flex-direction: column; }
        #code-header { padding: 5px 15px; background: #2d2d2d; font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }
        #code-content { flex: 1; padding: 10px; font-family: 'Consolas', monospace; font-size: 13px; color: #9cdcfe; overflow: auto; white-space: pre-wrap; tab-size: 2; }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <input type="text" id="search" placeholder="Tady plugin (ohatra: Fizika)...">
    <ul id="plugin-list"></ul>
</div>

<!-- MAIN CONTENT -->
<div id="main">
    <header>
        <h1 id="current-title">Mifidiana Plugin...</h1>
        <span style="font-size: 12px; opacity: 0.7;">v4.3.3 - Ady Goavana</span>

    <div id="canvas-container">

</div>

<script>
    // Fallback raha tsy load ny external file
    const R = window.R || window.RakitrakatraV4 || window.R4;
    if (!R) alert("Tsy hita ny Rakitrakatra JS library! Ampidiro ny file.");

    // --- DEMO CONFIGURATION ---
    const DEMOS = {
        "Lalao (Game Core)": {
            desc: "Ny fototry ny lalao manontolo.",
            code: `const game = new R.Lalao(800, 600, { canvas: document.getElementById('gameCanvas') });\ngame.start('SceneDemo');`,
            run: (g) => { /* Efa running ny game */ }
        },
        "Sehatra (Scene)": {
            desc: "Fitantanana ny scene (create, update, render).",
            code: `class MyScene extends R.Sehatra {\n  create() {\n    console.log("Scene created!");\n  }\n  update(dt) {\n    // Logic eto\n  }\n  render(r, cam) {\n    r.drawRect(100, 100, 50, 50, 0xFF0000FF);\n  }\n}`,
            run: (g) => {
                class DemoScene extends R.Sehatra {
                    create() { this.t = 0; }
                    update(dt) { this.t += dt; }
                    render(r, c) {
                        r.drawRect(350 + Math.sin(this.t)*50, 250, 100, 100, 0x00FF00FF);
                        if(r.drawText) r.drawText("Sehatra Demo", 350, 200, 20, 0xFFFFFFFF);
                    }
                }
                g.addScene('demo', DemoScene);
                g.scenes.start('demo');
            }
        },
        "Vondrona (ECS)": {
            desc: "Entity Component System haingana be.",
            code: `const id = ecs.create();\necs.x[id] = 100;\necs.y[id] = 100;\necs.w[id] = 32;\necs.h[id] = 32;\necs.color[id] = 0xFFFF00FF;`,
            run: (g) => {
                class ECSScene extends R.Sehatra {
                    create() {
                        this.ent = g.ecs.create();
                        g.ecs.x[this.ent] = 400; g.ecs.y[this.ent] = 300;
                        g.ecs.w[this.ent] = 50; g.ecs.h[this.ent] = 50;
                        g.ecs.color[this.ent] = 0x00FFFFFF;
                    }
                    update(dt) { g.ecs.rotation[this.ent] += dt; }
                    render(r, c) {
                        const e = this.ent;
                        r.drawRectRotated(g.ecs.x[e], g.ecs.y[e], g.ecs.w[e], g.ecs.h[e], g.ecs.rotation[e], g.ecs.color[e]);
                    }
                }
                g.addScene('ecs', ECSScene); g.scenes.start('ecs');
            }
        },
        "Mpampiseho (Renderer)": {
            desc: "WebGL Batch Renderer.",
            code: `renderer.drawRect(x, y, w, h, color);\nrenderer.drawSprite(x, y, w, h, sx, sy, sw, sh, color, 'texKey');`,
            run: (g) => {
                class RenderScene extends R.Sehatra {
                    render(r, c) {
                        r.drawRect(100, 100, 200, 200, 0xFF0000FF); // Red
                        r.drawRect(350, 100, 200, 200, 0x00FF0088); // Green Transparent
                        for(let i=0; i<10; i++) r.drawRect(100+i*30, 400, 20, 50, (i*25)<<24 | 0xFFFFFF);
                    }
                }
                g.addScene('render', RenderScene); g.scenes.start('render');
            }
        },
        "Fizika (Physics)": {
            desc: "Physics engine (AABB, Circle, Gravity).",
            code: `Fizika.step(V, dt, { gravity: 980 });\n// Set shape: 0=Rect, 1=Circle\nV.shape[id] = 1; V.isSolid[id] = 1;`,
            run: (g) => {
                class PhysScene extends R.Sehatra {
                    create() {
                        const floor = g.ecs.create();
                        g.ecs.x[floor]=0; g.ecs.y[floor]=550; g.ecs.w[floor]=800; g.ecs.h[floor]=50;
                        g.ecs.isStatic[floor]=1; g.ecs.isSolid[floor]=1; g.ecs.color[floor]=0x888888FF;

                        const ball = g.ecs.create();
                        g.ecs.x[ball]=400; g.ecs.y[ball]=100; g.ecs.w[ball]=40; g.ecs.h[ball]=40;
                        g.ecs.shape[ball]=1; g.ecs.isSolid[ball]=1; g.ecs.bounce[ball]=0.8; g.ecs.color[ball]=0xFFFF00FF;
                    }
                    update(dt) { R.Fizika.step(g.ecs, dt, {gravity: 900}); }
                    render(r, c) {
                        g.ecs.forEach(id => {
                            if(g.ecs.shape[id]===1) r.circle(g.ecs.x[id]+20, g.ecs.y[id]+20, 20, g.ecs.color[id]);
                            else r.drawRect(g.ecs.x[id], g.ecs.y[id], g.ecs.w[id], g.ecs.h[id], g.ecs.color[id]);
                        });
                    }
                }
                g.addScene('phys', PhysScene); g.scenes.start('phys');
            }
        },
        "Fanindry (Input)": {
            desc: "Keyboard, Mouse, Touch, Gamepad.",
            code: `if (Fanindry.isDown('arrowright')) x += 1;\nif (Fanindry.mouseJustDown(0)) fire();`,
            run: (g) => {
                class InputScene extends R.Sehatra {
                    create() { this.x = 400; this.y = 300; }
                    update(dt) {
                        const axis = R.Fanindry.axis();
                        this.x += axis.x * 200 * dt;
                        this.y += axis.y * 200 * dt;
                        if(R.Fanindry.mouseJustDown(0)) this.color = 0xFF0000FF;
                        else this.color = 0x00FF00FF;
                    }
                    render(r, c) {
                        r.drawRect(this.x-20, this.y-20, 40, 40, this.color);
                        if(r.drawText) r.drawText("Ampiasao Arrow na Mouse", 300, 50, 16, 0xFFFFFFFF);
                    }
                }
                g.addScene('input', InputScene); g.scenes.start('input');
            }
        },
        "Kamera": {
            desc: "Camera follow, shake, zoom.",
            code: `camera.follow(entityId);\ncamera.shake(10, 500);`,
            run: (g) => {
                class CamScene extends R.Sehatra {
                    create() {
                        this.p = g.ecs.create();
                        g.ecs.w[this.p]=30; g.ecs.h[this.p]=30; g.ecs.color[this.p]=0xFFFFFFFF;
                        g.camera.setBounds(-1000, -1000, 2000, 2000);
                    }
                    update(dt) {
                        const axis = R.Fanindry.axis();
                        g.ecs.x[this.p] += axis.x * 300 * dt;
                        g.ecs.y[this.p] += axis.y * 300 * dt;
                        g.camera.target = {x: g.ecs.x[this.p], y: g.ecs.y[this.p], w:30, h:30};
                        if(R.Fanindry.justPressed(' ')) g.camera.shake(20, 300);
                    }
                    render(r, c) {
                        for(let i=-1000; i<1000; i+=100) {
                            r.drawRect(i, -1000, 2, 2000, 0x333333FF);
                            r.drawRect(-1000, i, 2000, 2, 0x333333FF);
                        }
                        r.drawRect(g.ecs.x[this.p], g.ecs.y[this.p], 30, 30, 0xFFFFFFFF);
                    }
                }
                g.addScene('cam', CamScene); g.scenes.start('cam');
            }
        },
        "Vovoka (Particles)": {
            desc: "Particle System.",
            code: `particles.emit(x, y, { count: 10, speedMin: 50, lifeMax: 1 });`,
            run: (g) => {
                class PartScene extends R.Sehatra {
                    update(dt) {
                        if(Math.random() < 0.1) {
                            g.particles.emit(400, 300, { 
                                count: 5, speedMin: 50, speedMax: 150, 
                                color: 0xFFAA00FF, lifeMax: 1, gravity: 200 
                            });
                        }
                    }
                }
                g.addScene('part', PartScene); g.scenes.start('part');
            }
        },
        "Feo (Audio)": {
            desc: "WebAudio manager & Synthesizer.",
            code: `Feo.mamorona('jump'); // Synth sound\nFeo.play('music_key');`,
            run: (g) => {
                class AudioScene extends R.Sehatra {
                    render(r, c) {
                        r.drawRect(300, 250, 200, 100, 0x0000FFFF);
                        if(r.drawText) r.drawText("Tsindrio SPACE handrenesana feo", 250, 200, 16, 0xFFFFFFFF);
                    }
                    update(dt) {
                        if(R.Fanindry.justPressed(' ')) {
                            R.Feo.mamorona('jump');
                        }
                    }
                }
                g.addScene('audio', AudioScene); g.scenes.start('audio');
            }
        },
        "Tween (Mpanamora)": {
            desc: "Animation interpolation.",
            code: `MpitantanaTween.to(obj, {x: 500}, 1000, {ease:'bounceOut'});`,
            run: (g) => {
                class TweenScene extends R.Sehatra {
                    create() {
                        this.obj = {x: 100, y: 300};
                        R.MpitantanaTween.to(this.obj, {x: 700}, 2000, {ease: 'elasticOut', repeat: -1, yoyo: true});
                    }
                    render(r, c) {
                        r.drawRect(this.obj.x, this.obj.y, 50, 50, 0xFF00FFFF);
                    }
                }
                g.addScene('tween', TweenScene); g.scenes.start('tween');
            }
        },
        "Drafitra (Tilemap)": {
            desc: "Tiled Map Editor support.",
            code: `const map = Drafitra.fromTiled(jsonData, 'tilesetKey');\nmap.render(renderer, camera);`,
            run: (g) => {
                class MapScene extends R.Sehatra {
                    create() {
                        this.map = new R.Drafitra({tileSize: 40, width: 20, height: 15});
                        const data = [];
                        for(let y=0; y<15; y++) {
                            const row = [];
                            for(let x=0; x<20; x++) row.push((x+y)%2 === 0 ? 1 : 0);
                            data.push(row);
                        }
                        this.map.addLayer('ground', data);
                    }
                    render(r, c) {
                        for(let y=0; y<15; y++) for(let x=0; x<20; x++) {
                            if(this.map.layers[0].data[y][x] === 1)
                                r.drawRect(x*40, y*40, 40, 40, 0x444444FF);
                        }
                    }
                }
                g.addScene('map', MapScene); g.scenes.start('map');
            }
        },
        "Tabataba (Noise)": {
            desc: "Perlin Noise & FBM generation.",
            code: `const val = Tabataba.perlin2D(x, y);\nconst terrain = Tabataba.fbm(x, y, 4);`,
            run: (g) => {
                class NoiseScene extends R.Sehatra {
                    create() { this.offset = 0; }
                    update(dt) { this.offset += dt * 0.5; }
                    render(r, c) {
                        const size = 10;
                        for(let y=0; y<60; y++) {
                            for(let x=0; x<80; x++) {
                                const n = R.Tabataba.fbm(x*0.1 + this.offset, y*0.1, 3);
                                const c = Math.floor(n * 255);
                                if(c > 0) r.drawRect(x*size, y*size, size, size, (c<<24)|(c<<16)|(c<<8)|255);
                            }
                        }
                    }
                }
                g.addScene('noise', NoiseScene); g.scenes.start('noise');
            }
        },
        "Tehiromo (Save)": {
            desc: "LocalStorage management with compression.",
            code: `save.save(1, {score: 100});\nconst data = save.load(1);`,
            run: (g) => {
                alert("Jereo ny Console: Saving data...");
                g.save.save(1, {test: "Hello Rakitrakatra"});
                console.log("Loaded:", g.save.load(1));
            }
        },
        "Hetsika (Events)": {
            desc: "Event Emitter system.",
            code: `events.on('hit', (dmg) => ...);\nevents.emit('hit', 10);`,
            run: (g) => {
                const ev = new R.Hetsika();
                ev.on('test', (msg) => alert("Event received: " + msg));
                ev.emit('test', "Salama!");
            }
        },
        "Mpampiditra (Loader)": {
            desc: "Asset Loader (Images, JSON, Audio).",
            code: `loader.sary('hero', 'hero.png').load().then(...)`,
            run: (g) => { console.log("Loader ready."); }
        },
        "SakanToerana (Spatial Hash)": {
            desc: "Broadphase collision optimization.",
            code: `grid.insert(id, x, y, w, h);\nconst candidates = grid.query(x, y, w, h);`,
            run: (g) => { console.log("Spatial Hash initialized."); }
        },
        "HazoEfatra (QuadTree)": {
            desc: "Alternative Spatial Partitioning.",
            code: `tree.insert(rect);\ntree.retrieve(queryRect);`,
            run: (g) => { console.log("QuadTree initialized."); }
        },
        "Famataranandro (Timer)": {
            desc: "Delayed and repeating tasks.",
            code: `timer.after(1000, () => console.log('Done'));\ntimer.every(500, tick);`,
            run: (g) => {
                 class TimerScene extends R.Sehatra {
                     create() { 
                         this.msg = "Miandry...";
                         g.timer.after(2000, () => this.msg = "Vita ny 2 segondra!"); 
                     }
                     render(r,c) { if(r.drawText) r.drawText(this.msg, 300, 300, 20, 0xFFFFFFFF); }
                 }
                 g.addScene('timer', TimerScene); g.scenes.start('timer');
            }
        },
        "Sarimihetsika (Anim)": {
            desc: "Sprite Animation controller.",
            code: `anim.add('walk', [0,1,2,3], {fps:10});\nanim.play('walk');`,
            run: (g) => { console.log("Animation system ready."); }
        },
        "Taolana2D / EndrikaTaolana": {
            desc: "Skeletal Animation (Bones).",
            code: `const bone = new Taolana2D('arm');\nskeleton.updateWorld();`,
            run: (g) => { console.log("Skeleton system ready."); }
        },
        "DistanceJoint / SpringJoint": {
            desc: "Physics Constraints.",
            code: `new SpringJoint(entA, entB, restLength, {stiffness: 200});`,
            run: (g) => { console.log("Joints ready."); }
        },
        "Lalana (Pathfinding)": {
            desc: "A* Pathfinding on Grid.",
            code: `const path = Lalana.find(grid, sx, sy, ex, ey);`,
            run: (g) => {
                class PathScene extends R.Sehatra {
                    create() {
                        this.grid = [];
                        for(let y=0;y<15;y++) {
                            let r = []; 
                            for(let x=0;x<20;x++) r.push(Math.random()>0.8?1:0);
                            this.grid.push(r);
                        }
                        this.path = R.Lalana.find(this.grid, 0, 0, 19, 14);
                    }
                    render(r, c) {
                        const s = 40;
                        for(let y=0;y<15;y++) for(let x=0;x<20;x++) {
                            if(this.grid[y][x]) r.drawRect(x*s, y*s, s, s, 0x555555FF);
                        }
                        if(this.path) {
                            for(let p of this.path) r.drawRect(p.x*s+10, p.y*s+10, 20, 20, 0x00FF00FF);
                        }
                    }
                }
                g.addScene('path', PathScene); g.scenes.start('path');
            }
        },
        "Fivoarana (State Machine)": {
            desc: "Finite State Machine.",
            code: `fsm.add('idle', {...});\nfsm.set('run');`,
            run: (g) => { console.log("FSM ready."); }
        },
        "Fitondrantena (Behavior Tree)": {
            desc: "AI Behavior Trees.",
            code: `new Sequence(new Condition(...), new Action(...));`,
            run: (g) => { console.log("BT ready."); }
        },
        "Toetrandro (Weather)": {
            desc: "Rain/Snow system.",
            code: `weather.setMode('rain', 1);\nweather.update(dt);`,
            run: (g) => {
                class WxScene extends R.Sehatra {
                    create() { g.weather.setMode('rain', 2); }
                }
                g.addScene('wx', WxScene); g.scenes.start('wx');
            }
        },
        "DebugDrafitra": {
            desc: "Debug drawing helpers.",
            code: `debug.rect(x,y,w,h);\ndebug.circle(x,y,r);`,
            run: (g) => {
                class DbgScene extends R.Sehatra {
                    render(r, c) {
                        g.debug.rect(100, 100, 200, 200);
                        g.debug.circle(500, 300, 50);
                        g.debug.line(0,0,800,600);
                    }
                }
                g.addScene('dbg', DbgScene); g.scenes.start('dbg');
            }
        },
        "Antontanisa (Stats)": {
            desc: "FPS & Performance monitoring.",
            code: `stats.fps; stats.entityCount;`,
            run: (g) => { console.log("Stats active."); }
        },
        "MpitantanaFanamboarana (DevTools)": {
            desc: "In-game Debug Panel.",
            code: `devtools.toggle();`,
            run: (g) => {
                if(!g.devTools) {
                    g.devTools = new R.MpitantanaFanamboarana({vondrona: g.ecs});
                }
                g.devTools.toggle();
                alert("DevTools aseho eo amin'ny sisiny (mety ho very ao ambany indray).");
            }
        },
        "Entana (Inventory)": {
            desc: "Inventory slots management.",
            code: `inv.add({id:'sword', qty:1});`,
            run: (g) => { 
                const inv = new R.Entana(10);
                inv.add({id:'potion', qty:3});
                console.log("Inventory:", inv.slots);
            }
        },
        "Fiadiana (Weapon)": {
            desc: "Weapon switching & firing logic.",
            code: `weapon.fire(); weapon.reload();`,
            run: (g) => { console.log("Combat system ready."); }
        },
        "AndroAlina (DayNight)": {
            desc: "Day/Night cycle tint.",
            code: `AndroAlina.update(dt);\nconst tint = AndroAlina.tint();`,
            run: (g) => {
                class DNScene extends R.Sehatra {
                    update(dt) { R.AndroAlina.update(dt); }
                    render(r, c) {
                        const t = R.AndroAlina.tint();
                        const col = (Math.floor(t.r*255)<<24) | (Math.floor(t.g*255)<<16) | (Math.floor(t.b*255)<<8) | 255;
                        r.drawRect(0,0,800,600, col);
                    }
                }
                g.addScene('dn', DNScene); g.scenes.start('dn');
            }
        },
        "Fisintonana (Dash)": { desc: "Dash mechanic helper.", code: `dash.start(dx, dy);`, run: (g) => {} },
        "IsaMitohy (Combo)": { desc: "Score combo multiplier.", code: `combo.add(100);`, run: (g) => {} },
        "ZavaBita (Achievements)": { desc: "Achievement unlocker.", code: `achiev.unlock('first_kill');`, run: (g) => {} },
        "FivarotanaMock (Shop)": { desc: "Simple Shop system.", code: `shop.buy('item_id');`, run: (g) => {} },
        "Radar": { desc: "Proximity scanner.", code: `Radar.scan(x, y, range, entities);`, run: (g) => {} },
        "MpametakaMody (Modding)": { desc: "JSON Mod loader.", code: `MpametakaMody.register('gun_mod', data);`, run: (g) => {} }
    };

    // Fill remaining generic entries
    const EXTRAS = [
        "Vektora2", "Vektora3", "Lamina2D", "Efajoro", "Boribory", "Lafomaro", 
        "Kisendrasendra (Random)", "Piolaka (Spline)", "Rano (Water)", "Sarintany (Minimap)", 
        "Zavona (FogOfWar)", "JoystickVirtoaly", "TsipikaFotoana (Timeline)", 
        "FitaovanaVoa (Hitbox)", "FitahirizanaBaiko (Buffer)", "BokotraVirtoaly", 
        "FaribolanaMihena (Zone)", "EndrikaBala (BulletPattern)", "TantaraFandresena (KillFeed)", 
        "FanampianaKendrena (AimAssist)", "Fijerena (Spectator)", "KarazanTany (Biome)",

        "Anjara (LootTable)", "Vavahady (Portal)", "Firaketana (Replay)", "FiarovanaFitaka (AntiCheat)", 
        "Ekipa (Team)", "Fihetsehampo (Emote)", "FeoAkaiky (SpatialAudio)", "Akanjo (Skin)", 
        "VonoVono (Juice/FX)", "Fanoratana (Typewriter)", "FitsingerinaIsanAndro (DailyReward)", 
        "MpampianatraMatoatoa (Ghost)", "SarintanyMafana (Heatmap)", "MpitarikaAI (Director)", 
        "FanambaraKely (Ping)"
    ];

    EXTRAS.forEach(name => {
        if(!DEMOS[name]) {
            DEMOS[name] = {
                desc: "Utility class ao anatin'ny library.",
                code: `// Jereo ny documentation ao anatin'ny source code\n// Ohatra: new ${name}(...)`,
                run: (g) => { alert(`Ny ${name} dia utility class. Jereo ny console/log.`); }
            };
        }
    });


    // --- APP LOGIC ---

    const listEl = document.getElementById('plugin-list');
    const titleEl = document.getElementById('current-title');
    const codeEl = document.getElementById('code-content');
    const searchEl = document.getElementById('search');
    const containerEl = document.getElementById('canvas-container');
    
    let currentGame = null;

    function initList(filter = "") {
        listEl.innerHTML = "";
        Object.keys(DEMOS).sort().forEach(key => {
            if(key.toLowerCase().includes(filter.toLowerCase())) {
                const li = document.createElement('li');
                li.className = 'plugin-item';
                li.textContent = key;
                li.onclick = () => loadDemo(key, li);
                listEl.appendChild(li);
            }
        });
    }

    function loadDemo(name, el) {
        // UI Update
        document.querySelectorAll('.plugin-item').forEach(i => i.classList.remove('active'));
        if(el) el.classList.add('active');
        titleEl.textContent = name;
        codeEl.textContent = DEMOS[name].code;

        // 1. Stop old game
        if(currentGame) {
            currentGame.stop();
            currentGame = null;
        }

        // 2. FIX: Manaisotra ny canvas taloha tanteraka mba tsy hisy singleton conflict
        const oldCanvas = document.getElementById('gameCanvas');
        if(oldCanvas) oldCanvas.remove();

        // 3. FIX: Reset Fanindry singleton flag satria canvas vaovao no ampiasaina
        if(R.Fanindry) {
            R.Fanindry._init = false;
            R.Fanindry._canvas = null;
        }

        // 4. Mamorona canvas vaovao
        const newCanvas = document.createElement('canvas');
        newCanvas.id = 'gameCanvas';
        newCanvas.width = 800;
        newCanvas.height = 600;
        containerEl.appendChild(newCanvas);

        // 5. Init New Game Instance
        try {
            currentGame = new R.Lalao(800, 600, { canvas: newCanvas });
            
            // Run specific demo setup
            DEMOS[name].run(currentGame);
            
            // Start loop if not started by run()
            if(!currentGame._running && name !== "Lalao (Game Core)") {
                if(currentGame.scenes._running.length === 0) {
                     class Empty extends R.Sehatra { render(r){ r.clear(0.2,0.2,0.2,1); }}
                     currentGame.addScene('empty', Empty);
                     currentGame.scenes.start('empty');
                }
                currentGame.start(null);
            }

        } catch(e) {
            console.error(e);
            alert("Misy olana: " + e.message);
        }
    }

    function copyCode() {
        navigator.clipboard.writeText(codeEl.textContent);
        const btn = document.querySelector('#code-header button');
        const orig = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = orig, 1000);
    }

    searchEl.addEventListener('input', (e) => initList(e.target.value));

    // Initialize
    initList();

</script>
</body>
</html>
