<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKITRAKATRA V4.2.1 - Plugin Explorer</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel: #12121a;
            --border: #2a2a3a;
            --accent: #00ff88;
            --accent-dim: #00ff8833;
            --text: #e0e0e0;
            --text-dim: #888;
            --code-bg: #1a1a24;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Header */
        header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
        header h1 { font-size: 18px; color: var(--accent); }
        header .version { font-size: 12px; color: var(--text-dim); background: var(--accent-dim); padding: 2px 8px; border-radius: 4px; }
        
        /* Main Layout */
        .main { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar - Plugin List */
        .sidebar { width: 280px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
        .sidebar input { width: 100%; padding: 10px 14px; background: var(--panel); border: none; border-bottom: 1px solid var(--border); color: var(--text); font-size: 13px; outline: none; }
        .sidebar input::placeholder { color: var(--text-dim); }
        .plugin-list { list-style: none; }
        .plugin-item { padding: 8px 14px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; }
        .plugin-item:hover { background: var(--accent-dim); }
        .plugin-item.active { background: var(--accent-dim); border-left-color: var(--accent); color: var(--accent); }
        .plugin-item .cat { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
        .cat-tag { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .cat-A { background: #ff444433; color: #ff6666; }
        .cat-B { background: #ff880033; color: #ffaa44; }
        .cat-C { background: #4488ff33; color: #66aaff; }
        .cat-D { background: #aa44ff33; color: #cc88ff; }
        .cat-E { background: #ffff0033; color: #ffff66; }
        .cat-core { background: #00ff8833; color: #00ff88; }
        
        /* Content Area */
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Demo Canvas Area */
        .demo-area { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; min-height: 300px; }
        .demo-area canvas { border: 1px solid var(--border); image-rendering: pixelated; }
        .demo-overlay { position: absolute; top: 10px; right: 10px; font-size: 11px; color: var(--text-dim); pointer-events: none; }
        .demo-controls { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 8px; }
        .demo-btn { padding: 5px 12px; background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; cursor: pointer; font-size: 12px; }
        .demo-btn:hover { background: var(--accent); color: #000; }
        
        /* Code Panel */
        .code-panel { height: 280px; border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .code-tabs { display: flex; border-bottom: 1px solid var(--border); }
        .code-tab { padding: 8px 16px; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-dim); }
        .code-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .code-content { flex: 1; overflow: auto; padding: 14px; background: var(--code-bg); }
        .code-content pre { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #c0c0d0; }
        .code-content .kw { color: #cc77ff; }
        .code-content .fn { color: #66ccff; }
        .code-content .str { color: #88ff88; }
        .code-content .num { color: #ffaa44; }
        .code-content .cmt { color: #666; font-style: italic; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        
        /* Responsive */
        @media (max-width: 768px) {
            .main { flex-direction: column; }
            .sidebar { width: 100%; height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
            .code-panel { height: 200px; }
        }
    </style>
</head>
<body>

<header>
    <h1>⚡ RAKITRAKATRA V4.2.1</h1>
    <span class="version">85 Plugins • Teny Gasy • WebGL2</span>
</header>

<div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
        <input type="text" id="searchInput" placeholder="🔍 Hitady plugin...">
        <ul class="plugin-list" id="pluginList"></ul>
    </div>
    
    <!-- Content -->
    <div class="content">
        <div class="demo-area" id="demoArea">
            <canvas id="demoCanvas" width="640" height="400"></canvas>
            <div class="demo-overlay" id="demoOverlay">FPS: --</div>
            <div class="demo-controls" id="demoControls"></div>
        </div>
        <div class="code-panel">
            <div class="code-tabs">
                <div class="code-tab active" data-tab="usage">📖 Fampiasana</div>
                <div class="code-tab" data-tab="source">🔧 Source Code</div>
                <div class="code-tab" data-tab="api">📋 API Reference</div>
            </div>
            <div class="code-content">
                <pre id="codeDisplay"><span class="cmt">// Safidio ny plugin iray ao amin'ny lisitra havia...</span></pre>
            </div>
        </div>
    </div>
</div>

<script>

<script src="rakitrakatra.js"></script>

<script>
// ============================================================
// PLUGIN REGISTRY - 85 plugins with demos & usage code
// ============================================================
const PLUGINS = [
    // ---- CORE ----
    { id: 'Vektora2', name: 'Vektora2', cat: 'core', desc: 'Vecteur 2D optimized',
      usage: `// Mamorona vektora\nconst v = new R.Vektora2(10, 20);\n\n// Manampy\nv.add(new R.Vektora2(5, 3));\nconsole.log(v.x, v.y); // 15, 23\n\n// Normalize\nv.normalize();\n\n// Static methods\nconst d = R.Vektora2.distance(a, b);\nconst lerped = R.Vektora2.lerp(a, b, 0.5);`,
      demo: (ctx, w, h, t) => {
          const cx = w/2, cy = h/2;
          for(let i = 0; i < 8; i++) {
              const a = (i/8)*Math.PI*2 + t;
              const v = R.Vektora2.fromAngle(a, 100);
              ctx.strokeStyle = '#00ff88';
              ctx.lineWidth = 2;
              ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx+v.x, cy+v.y); ctx.stroke();
              ctx.fillStyle = '#00ff88';
              ctx.beginPath(); ctx.arc(cx+v.x, cy+v.y, 4, 0, Math.PI*2); ctx.fill();
          }
      }
    },
    { id: 'Efajoro', name: 'Efajoro', cat: 'core', desc: 'Rectangle AABB',
      usage: `const r = new R.Efajoro(10, 20, 100, 50);\n\n// Properties\nconsole.log(r.left, r.right, r.cx, r.cy);\n\n// Collision\nif (r.intersects(otherRect)) {\n  const overlap = r.intersection(otherRect);\n}`,
      demo: (ctx, w, h, t) => {
          const r1 = new R.Efajoro(w/2-60+Math.sin(t)*40, h/2-30, 80, 60);
          const r2 = new R.Efajoro(w/2-20, h/2-40+Math.cos(t*1.3)*30, 60, 80);
          ctx.strokeStyle = '#00ff88'; ctx.strokeRect(r1.x, r1.y, r1.w, r1.h);
          ctx.strokeStyle = '#ff4444'; ctx.strokeRect(r2.x, r2.y, r2.w, r2.h);
          if(r1.intersects(r2)) {
              const inter = r1.intersection(r2);
              if(inter) { ctx.fillStyle='rgba(255,255,0,0.3)'; ctx.fillRect(inter.x,inter.y,inter.w,inter.h); }
          }
      }
    },
    { id: 'Boribory', name: 'Boribory', cat: 'core', desc: 'Circle collision',
      usage: `const c = new R.Boribory(100, 100, 30);\n\nif (c.contains(mouseX, mouseY)) {\n  console.log('Inside!');\n}\n\nif (c.intersectsRect(rect)) {\n  // circle-rect collision\n}`,
      demo: (ctx, w, h, t) => {
          const c1 = new R.Boribory(w/2+Math.sin(t)*80, h/2, 30);
          const c2 = new R.Boribory(w/2-Math.sin(t)*80, h/2, 25);
          ctx.beginPath(); ctx.arc(c1.x,c1.y,c1.r,0,Math.PI*2); ctx.strokeStyle='#00ff88'; ctx.stroke();
          ctx.beginPath(); ctx.arc(c2.x,c2.y,c2.r,0,Math.PI*2); ctx.strokeStyle='#ff4444'; ctx.stroke();
          if(c1.intersects(c2)) { ctx.fillStyle='rgba(255,255,0,0.4)'; ctx.beginPath(); ctx.arc((c1.x+c2.x)/2,(c1.y+c2.y)/2,10,0,Math.PI*2); ctx.fill(); }
      }
    },
    { id: 'Lamina2D', name: 'Lamina2D', cat: 'core', desc: 'Matrice 2D transform',
      usage: `const m = new R.Lamina2D();\nm.translate(100, 50);\nm.rotate(Math.PI / 4);\nm.scale(2, 2);\n\nconst point = m.transformPoint(10, 0);`,
      demo: (ctx, w, h, t) => {
          const m = new R.Lamina2D();
          m.translate(w/2, h/2); m.rotate(t); m.scale(1+Math.sin(t*2)*0.3, 1+Math.cos(t*2)*0.3);
          ctx.save(); ctx.setTransform(m.m[0],m.m[1],m.m[2],m.m[3],m.m[4],m.m[5]);
          ctx.strokeStyle='#00ff88'; ctx.lineWidth=2; ctx.strokeRect(-40,-40,80,80);
          ctx.fillStyle='#00ff8833'; ctx.fillRect(-40,-40,80,80);
          ctx.restore();
      }
    },
    { id: 'Z', name: 'Z Utils', cat: 'core', desc: 'Fitahirizana fonctions utilitaires',
      usage: `R.Z.lerp(0, 100, 0.5);     // 50\nR.Z.clamp(150, 0, 100);    // 100\nR.Z.rand(10, 20);          // random 10-20\nR.Z.shuffle([1,2,3,4]);   // shuffled copy\nR.Z.uuid();                // unique ID`,
      demo: (ctx, w, h, t) => {
          for(let i=0;i<20;i++){
              const x = R.Z.rand(20, w-20);
              const y = R.Z.lerp(h*0.3, h*0.7, R.Z.smoothstep((Math.sin(t+i*0.5)+1)/2));
              const s = R.Z.map(Math.sin(t*2+i), -1, 1, 3, 10);
              ctx.fillStyle = \`hsl(\${i*18}, 80%, 60%)\`;
              ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2); ctx.fill();
          }
      }
    },
    
    // ---- ECS & SYSTEMS ----
    { id: 'Vondrona', name: 'Vondrona (ECS)', cat: 'core', desc: 'Entity Component System SoA',
      usage: `const ecs = new R.Vondrona(1000);\nconst id = ecs.create();\necs.x[id] = 100;\necs.y[id] = 200;\necs.hp[id] = 50;\n\n// Query by tag\necs.setTag(id, 1);\necs.query(1, (eid) => {\n  console.log(ecs.x[eid], ecs.y[eid]);\n});\n\n// Destroy\necs.destroy(id);`,
      demo: (ctx, w, h, t) => {
          if(!this._ecs) { this._ecs = new R.Vondrona(500); for(let i=0;i<100;i++){const id=this._ecs.create();this._ecs.x[id]=Math.random()*w;this._ecs.y[id]=Math.random()*h;this._ecs.vx[id]=(Math.random()-0.5)*60;this._ecs.vy[id]=(Math.random()-0.5)*60;this._ecs.color[id]=0xFF00FF88;} }
          const ecs=this._ecs; const dt=0.016;
          ecs.forEach(id=>{ecs.x[id]+=ecs.vx[id]*dt;ecs.y[id]+=ecs.vy[id]*dt;if(ecs.x[id]<0||ecs.x[id]>w)ecs.vx[id]*=-1;if(ecs.y[id]<0||ecs.y[id]>h)ecs.vy[id]*=-1;});
          ecs.forEach(id=>{ctx.fillStyle='#00ff88';ctx.fillRect(ecs.x[id]-2,ecs.y[id]-2,4,4);});
      }
    },
    { id: 'SakanToerana', name: 'SakanToerana', cat: 'core', desc: 'Spatial Hash Grid O(n)',
      usage: `const grid = new R.SakanToerana(64);\ngrid.insert(entityId, x, y, w, h);\n\n// Query region\nconst candidates = grid.query(rx, ry, rw, rh);\nfor (const id of candidates) {\n  // check precise collision\n}`,
      demo: (ctx, w, h, t) => {
          const grid = new R.SakanToerana(64);
          const entities = [];
          for(let i=0;i<50;i++) { const e={x:Math.random()*w,y:Math.random()*h,w:8,h:8}; entities.push(e); grid.insert(i,e.x,e.y,e.w,e.h); }
          const qx=w/2-50+Math.sin(t)*100, qy=h/2-50+Math.cos(t*0.7)*80;
          const found = grid.query(qx,qy,100,100);
          ctx.strokeStyle='#333'; 
          for(let x=0;x<w;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
          for(let y=0;y<h;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
          entities.forEach((e,i)=>{ctx.fillStyle=found.has(i)?'#ffff00':'#00ff8844';ctx.fillRect(e.x,e.y,e.w,e.h);});
          ctx.strokeStyle='#ff4444';ctx.lineWidth=2;ctx.strokeRect(qx,qy,100,100);
      }
    },
    { id: 'Mpampiseho', name: 'Mpampiseho', cat: 'core', desc: 'WebGL2 Batched Renderer',
      usage: `const renderer = new R.Mpampiseho(canvas);\nrenderer.begin(camera);\nrenderer.drawSprite(x,y,w,h, sx,sy,sw,sh, color, 'textureKey');\nrenderer.drawRect(x,y,w,h, 0xFFFF00FF);\nrenderer.end(); // flush() automatique`,
      demo: (ctx, w, h, t) => {
          for(let i=0;i<200;i++){
              const x=(i*37+t*50)%w, y=(i*53+Math.sin(t+i)*30)%h;
              ctx.fillStyle=\`hsla(\${i*3},70%,60%,0.7)\`;
              ctx.fillRect(x,y,6,6);
          }
      }
    },
    { id: 'Kamera', name: 'Kamera', cat: 'core', desc: 'Camera follow/shake/deadzone',
      usage: `const cam = new R.Kamera(800, 600);\ncam.follow(playerEntity, 0.1);\ncam.setBounds(0, 0, 2000, 1500);\ncam.shake(10, 300); // magnitude, ms\ncam.update(dtMs);\n\n// Convert coordinates\nconst world = cam.screenToWorld(mx, my);`,
      demo: (ctx, w, h, t) => {
          ctx.fillStyle='#1a1a24';
          for(let x=0;x<w;x+=40)for(let y=0;y<h;y+=40){ctx.fillRect(x+Math.sin(t+x*0.01)*5,y+Math.cos(t+y*0.01)*5,2,2);}
          const cx=w/2+Math.sin(t)*100, cy=h/2+Math.cos(t*0.7)*80;
          ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.strokeRect(cx-15,cy-15,30,30);
          ctx.fillStyle='#00ff8833';ctx.font='11px monospace';ctx.fillText('camera target',cx-35,cy+30);
      }
    },
    { id: 'Fanindry', name: 'Fanindry', cat: 'core', desc: 'Input keyboard/mouse/touch/gamepad',
      usage: `R.Fanindry.init(canvas);\n\n// Keyboard\nif (R.Fanindry.isDown('arrowright')) moveRight();\nif (R.Fanindry.justPressed(' ')) jump();\n\n// Mouse\nif (R.Fanindry.mouseJustDown(0)) shoot();\n\n// Combined axis (KB + Gamepad + Touch)\nconst axis = R.Fanindry.axis();\nplayer.vx = axis.x * speed;`,
      demo: (ctx, w, h, t) => {
          const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'];
          keys.forEach((k,i)=>{
              const down = R && R.Fanindry && R.Fanindry.keys && R.Fanindry.keys.has(k.toLowerCase());
              ctx.fillStyle = down ? '#00ff88' : '#333';
              ctx.fillRect(w/2-120+i*50, h/2-20, 40, 40);
              ctx.fillStyle = '#fff'; ctx.font='9px monospace';
              ctx.fillText(k.slice(0,4), w/2-118+i*50, h/2+5);
          });
          ctx.fillStyle='#888';ctx.font='12px sans-serif';ctx.fillText('Tsindrio ny kitendry...',w/2-80,h/2+50);
      }
    },
    
    // ---- A. CORE GAMEPLAY ----
    { id: 'FitaovanaVoa', name: 'FitaovanaVoa', cat: 'A', desc: 'Hitbox/Hurtbox + Spatial Hash',
      usage: `const combat = new R.FitaovanaVoa(64);\n\n// Add hitbox (attack)\ncombat.addHitbox(attacker, {x,y,w,h}, damage, team);\n\n// Add hurtbox (body)\ncombat.addHurtbox(victim, {x,y,w,h}, team);\n\n// Update with callback\ncombat.update((hit, hurt) => {\n  hurt.owner.hp -= hit.damage;\n  console.log('Hit!', hit.damage);\n});`,
      demo: (ctx, w, h, t) => {
          const combat = new R.FitaovanaVoa(64);
          const hx=w/2-30+Math.sin(t*2)*60, hy=h/2-20;
          combat.addHitbox({}, {x:hx,y:hy,w:40,h:40}, 10, 0);
          combat.addHurtbox({}, {x:w/2-10,y:h/2-10,w:30,h:30}, 1);
          let hit=false;
          combat.update(()=>{hit=true;});
          ctx.fillStyle=hit?'#ff4444':'#00ff8844';ctx.fillRect(hx,hy,40,40);
          ctx.fillStyle='#4488ff';ctx.fillRect(w/2-10,h/2-10,30,30);
          if(hit){ctx.fillStyle='#ffff00';ctx.font='bold 20px sans-serif';ctx.fillText('HIT!',w/2+30,h/2-20);}
          ctx.fillStyle='#888';ctx.font='11px monospace';ctx.fillText('Team 0 vs Team 1',10,h-10);
      }
    },
    { id: 'FitahirizanaBaiko', name: 'FitahirizanaBaiko', cat: 'A', desc: 'Input Buffer + Coyote Time',
      usage: `const input = new R.FitahirizanaBaiko(0.15, 0.1);\n\n// Record press\ninput.press('jump');\n\n// Check buffer (within 150ms)\nif (input.consume('jump')) doJump();\n\n// Coyote time (can still jump 100ms after falling)\ninput.setGrounded(onGround);\nif (input.canCoyote()) canStillJump = true;`,
      demo: (ctx, w, h, t) => {
          const bufferT = 0.15;
          const phase = (t % 2) / 2; // 0-1 cycle every 2s
          const pressed = phase > 0.3 && phase < 0.35;
          const consumed = phase > 0.3 && phase < 0.35 + bufferT;
          ctx.fillStyle='#333';ctx.fillRect(w/2-150,h/2-10,300,20);
          ctx.fillStyle=pressed?'#00ff88':consumed?'#ffff0066':'#222';
          ctx.fillRect(w/2-150,h/2-10,300*(phase),20);
          ctx.fillStyle='#fff';ctx.font='11px monospace';
          ctx.fillText(pressed?'PRESS':'buffer window',w/2-40,h/2-20);
          ctx.fillText(`coyote: ${bufferT}s`,w/2-40,h/2+30);
      }
    },
    { id: 'Fiadiana', name: 'Fiadiana', cat: 'A', desc: 'Weapon arsenal/cooldown/reload',
      usage: `const arsenal = new R.Fiadiana([\n  { name:'Pistol', ammo:12, maxAmmo:12, cooldown:0.3, reloadTime:1.5 },\n  { name:'Rifle', ammo:30, maxAmmo:30, cooldown:0.1, reloadTime:2.0 }\n]);\n\nif (arsenal.canFire()) {\n  arsenal.fire();\n  spawnBullet();\n}\nif (reloadKey) arsenal.reload();\narsenal.switchTo(1); // switch weapon\narsenal.update(dt);`,
      demo: (ctx, w, h, t) => {
          const weapons=[{name:'Pistol',ammo:12,max:12,cd:0.3},{name:'Rifle',ammo:30,max:30,cd:0.1}];
          const idx=Math.floor(t/3)%2; const wp=weapons[idx];
          const ammoLeft=Math.max(0,wp.ammo-Math.floor((t%3)*wp.cd*10));
          ctx.fillStyle='#222';ctx.fillRect(w/2-100,h/2-30,200,60);
          ctx.fillStyle='#00ff88';ctx.font='bold 14px monospace';ctx.fillText(wp.name,w/2-80,h/2-10);
          ctx.fillStyle=ammoLeft>wp.max*0.3?'#00ff88':'#ff4444';
          ctx.fillRect(w/2-80,h/2+5,160*(ammoLeft/wp.max),12);
          ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.fillText(\`\${ammoLeft}/\${wp.max}\`,w/2-80,h/2+28);
      }
    },
    { id: 'AndroAlina', name: 'AndroAlina', cat: 'A', desc: 'Day/Night cycle ✅ FIXED',
      usage: `R.AndroAlina.update(dt);\n\nconst tint = R.AndroAlina.tint();\n// Returns {r,g,b,a} overlay color\n\nif (R.AndroAlina.isNight()) {\n  activateNightVision();\n}\n\n// Manual control\nR.AndroAlina.setTime(0.5); // noon`,
      demo: (ctx, w, h, t) => {
          R.AndroAlina._t = (t * 10) % R.AndroAlina.dayLength;
          const tint = R.AndroAlina.tint();
          const p = R.AndroAlina.phase();
          // Sky gradient
          const grad = ctx.createLinearGradient(0,0,0,h);
          const brightness = 1 - tint.a;
          grad.addColorStop(0, \`rgb(\${30+brightness*100},\${40+brightness*140},\${80+brightness*175})\`);
          grad.addColorStop(1, \`rgb(\${20+brightness*60},\${30+brightness*80},\${50+brightness*100})\`);
          ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
          // Sun/Moon
          const sunY = h*0.2 + Math.sin((p-0.5)*Math.PI*2)*h*0.3;
          ctx.fillStyle=p>0.2&&p<0.7?'#ffdd44':'#ddeeff';
          ctx.beginPath();ctx.arc(w*0.7,sunY,20,0,Math.PI*2);ctx.fill();
          // Overlay
          ctx.fillStyle=\`rgba(5,5,25,\${tint.a})\`;ctx.fillRect(0,0,w,h);
          ctx.fillStyle='#fff';ctx.font='12px monospace';

// ============================================================
// APP LOGIC
// ============================================================
let currentPlugin = null;
let demoAnimId = null;
let demoStartTime = 0;
let activeTab = 'usage';

// Build sidebar
function buildSidebar(filter = '') {
    const list = document.getElementById('pluginList');
    list.innerHTML = '';
    const f = filter.toLowerCase();
    PLUGINS.forEach(p => {
        if (f && !p.name.toLowerCase().includes(f) && !p.desc.toLowerCase().includes(f) && !p.cat.toLowerCase().includes(f)) return;
        const li = document.createElement('li');
        li.className = 'plugin-item' + (currentPlugin && currentPlugin.id === p.id ? ' active' : '');
        const catClass = p.cat === 'core' ? 'cat-core' : `cat-${p.cat}`;
        li.innerHTML = `<span>${p.name}</span><span class="cat-tag ${catClass}">${p.cat}</span>`;
        li.onclick = () => selectPlugin(p);
        list.appendChild(li);
    });
}

// Select plugin
function selectPlugin(plugin) {
    currentPlugin = plugin;
    buildSidebar(document.getElementById('searchInput').value);
    updateCodeDisplay();
    startDemo();
}

// Update code display
function updateCodeDisplay() {
    if (!currentPlugin) return;
    const el = document.getElementById('codeDisplay');
    if (activeTab === 'usage') {
        el.innerHTML = highlightCode(`// ${currentPlugin.name} — ${currentPlugin.desc}\n\n${currentPlugin.usage}`);
    } else if (activeTab === 'source') {
        el.innerHTML = highlightCode(`// Source: R.${currentPlugin.id}\n// Jereo ao amin'ny rakitrakatra.js\n// Line ~${getApproxLine(currentPlugin.id)}`);
    } else if (activeTab === 'api') {
        el.innerHTML = highlightCode(getApiRef(currentPlugin));
    }
}

function getApiRef(p) {

// Simple syntax highlighting
function highlightCode(code) {
    return code
        .replace(/\/\/.*$/gm, m => `<span class="cmt">${m}</span>`)
        .replace(/\b(const|let|var|new|return|if|else|for|while|function|class|this|true|false|null|undefined)\b/g, '<span class="kw">$1</span>')
        .replace(/\b(R\.\w+|\w+)\(/g, '<span class="fn">$1</span>(')
        .replace(/'[^']*'/g, m => `<span class="str">${m}</span>`)
        .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
}

// Start demo animation
function startDemo() {
    if (demoAnimId) cancelAnimationFrame(demoAnimId);
    const canvas = document.getElementById('demoCanvas');
    const ctx = canvas.getContext('2d');
    demoStartTime = performance.now();
    
    function loop() {
        const t = (performance.now() - demoStartTime) / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        if (currentPlugin && currentPlugin.demo) {
            try {
                currentPlugin.demo(ctx, canvas.width, canvas.height, t);
            } catch(e) {
                ctx.fillStyle = '#ff4444';
                ctx.font = '14px monospace';
                ctx.fillText('Error: ' + e.message, 20, 40);
            }
        }
        
        // FPS counter
        document.getElementById('demoOverlay').textContent = `FPS: ${Math.round(1000/(performance.now()-demoStartTime)*t)||'--'} | t=${t.toFixed(1)}s`;
        
        demoAnimId = requestAnimationFrame(loop);
    }
    loop();
}

});
