<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakitrakatra V4.2.0 - 100 Plugins</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #c0d8f0;
            font-family: 'Segoe UI', 'Courier New', monospace;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #66ddff;
            font-size: 28px;
            border-bottom: 2px solid #2a3a5a;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 small { font-size: 14px; color: #6688aa; }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .filters button {
            background: #111f33;
            border: 1px solid #2a3a5a;
            color: #88bbdd;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .filters button:hover, .filters button.active {
            background: #1a3355;
            border-color: #66aaff;
            color: #ffffff;
        }
        #container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 16px;
        }
        .plugin {
            background: #111828;
            border: 1px solid #1a2a44;
            border-radius: 10px;
            padding: 16px 18px;
            transition: all 0.2s;
            position: relative;
        }
        .plugin:hover {
            border-color: #4488cc;
            background: #16203a;
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0,40,120,0.15);
        }
        .plugin .num {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 11px;
            color: #335577;
            font-weight: bold;
        }
        .plugin .name {
            color: #88ddff;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .plugin .desc {
            color: #99bbdd;
            font-size: 12.5px;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .plugin .code {
            background: #0a0f1a;
            border: 1px solid #1a2a44;
            border-radius: 6px;
            padding: 10px 12px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #88ddbb;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 130px;
            overflow-y: auto;
        }
        .plugin .code .kw { color: #ff88aa; }
        .plugin .code .fn { color: #88ddff; }
        .plugin .code .str { color: #aadd88; }
        .plugin .code .cmt { color: #446688; }
        .plugin .code .numv { color: #ffaa66; }
        .plugin .badge {
            display: inline-block;
            font-size: 9px;
            background: #1a2a44;
            color: #77aacc;
            padding: 2px 10px;
            border-radius: 12px;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }
        .plugin .badge.core { background: #1a3344; color: #66aadd; }
        .plugin .badge.math { background: #1a2a33; color: #66ccaa; }
        .plugin .badge.gameplay { background: #2a1a33; color: #cc88dd; }
        .plugin .badge.ui { background: #1a2a33; color: #66ccaa; }
        .plugin .badge.effect { background: #331a22; color: #dd88aa; }
        .plugin .badge.util { background: #1a2a22; color: #88cc88; }
        .plugin .badge.net { background: #1a2233; color: #88aadd; }
        .footer {
            text-align: center;
            margin-top: 35px;
            color: #446688;
            font-size: 12px;
            border-top: 1px solid #1a2a44;
            padding-top: 18px;
        }
        .footer span { color: #66aadd; }
        .search {
            background: #0a0f1a;
            border: 1px solid #1a2a44;
            border-radius: 20px;
            padding: 8px 18px;
            color: #c0d8f0;
            width: 300px;
            max-width: 80%;
            font-size: 13px;
            outline: none;
        }
        .search:focus { border-color: #4488cc; }
        @media (max-width: 600px) {
            #container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<h1>⚡ RAKITRAKATRA V4.2.0 <small>— 100 Plugins & Systems</small></h1>

<div class="filters">
    <input class="search" id="searchInput" placeholder="🔍 Karohy plugin...">
    <button class="active" data-filter="all">📦 Rehetra</button>
    <button data-filter="core">🎯 Core</button>
    <button data-filter="math">📐 Math</button>
    <button data-filter="gameplay">🎮 Gameplay</button>
    <button data-filter="ui">🖥️ UI</button>
    <button data-filter="effect">✨ Effect</button>
    <button data-filter="util">🔧 Util</button>
    <button data-filter="net">🌐 Network</button>
</div>

<div id="container"></div>

<div class="footer">
    <span>✦</span> 100 Plugins — Tsirairay manana code exemple <span>✦</span>
</div>


<script src="rakitrakatra.js"></script>

<!-- ============================================================
     FAMPIASANA PLUGINS (1-100)
     ============================================================ -->
<script>

    // ============ CORE (1-15) ============
    {
        num: 1, name: 'Z', category: 'core',

R.Z.lerp(0, 10, 0.5); // 5

// Halavany
v.len(); // 5

// Normalisation
v.normalize(); // { x: 0.6, y: 0.8 }

// Fanampiana
v.add(new R.Vektora2(1, 0)); // { x: 1.6, y: 0.8 }

// Afovoany
r.cx; // 60
r.cy; // 60`

// Mamoaka hetsika

// Indray mandeha ihany

e.emit('init'); // mandeha
e.emit('init'); // tsy mandeha intsony

// Manala hetsika

// Mampiasa azy...

// Mamerina azy
pool.avereno(obj);

// Statistika

rng.next(); // 0.156...

rng.range(0, 100); // 45.67

rng.int(1, 10); // 7

// Mifidy ao anaty tableau
rng.choice(['a', 'b', 'c']);

// Averina indray

R.Mpanamora.easeInQuad(0.5); // 0.25
R.Mpanamora.easeOutQuad(0.5); // 0.75

R.Mpanamora.easeOutElastic(0.5); // 0.84

// Ampiasaina amin'ny animation
const progress = R.Mpanamora.easeOutCubic(time / duration);`

    {
        num: 13, name: 'Vondrona (ECS)', category: 'core',

// Mamorona entity
const id = ecs.create();

// Mametraka composants
ecs.x[id] = 100;
ecs.y[id] = 200;
ecs.w[id] = 32;
ecs.h[id] = 32;
ecs.tag[id] = 1;
ecs.color[id] = 0xFF00FFFF;

// Query amin'ny tag

// Mampiditra entity
grid.insert(id, ecs.x[id], ecs.y[id], ecs.w[id], ecs.h[id]);

// Query amin'ny faritra

// Hamafina
grid.clear();`

        num: 15, name: 'HazoEfatra', category: 'core',

}, 10); // 10 heny

// Mampiato

timer.pause(t.id);
timer.resume(t.id);

// Fanavaozana isaky ny frame
timer.update(dtMs);`

    {
        num: 17, name: 'MpitantanaTween', category: 'core',

    ease: 'easeOutQuad',
    delay: 200,
    onComplete: () => console.log('Vita!')
});

// Miverimberina
R.MpitantanaTween.to(obj, { alpha: 0 }, 500, {
    repeat: 3,
    yoyo: true
});

// Fanavaozana isaky ny frame
R.MpitantanaTween.update(dtMs);

// Mamono rehetra
R.MpitantanaTween.killAll();`

    {
        num: 18, name: 'Mpampiditra', category: 'core',
        desc: 'Asset loader: sary, json, feo, spriteSheet, load, unloadImage, unloadJson, unloadAudio, unloadAll.',

loader.json('data', 'data.json');
loader.feo('jump', 'jump.wav');
loader.spriteSheet('hero', 'hero.png', 32, 32);

// Mijery ny fandrosoana

// ============================================================
// FANORINANA NY HTML
// ============================================================
const container = document.getElementById('container');

function renderPlugins(filter = 'all', search = '') {
    container.innerHTML = '';
    const filtered = pluginsData.filter(p => {
        const matchFilter = filter === 'all' || p.category === filter;
        const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) ||
                           p.desc.toLowerCase().includes(search.toLowerCase());
        return matchFilter && matchSearch;
    });

    if (filtered.length === 0) {
        container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#446688;">Tsy misy plugin mifanandrify</div>';
        return;
    }

    filtered.forEach(p => {
        const div = document.createElement('div');
        div.className = 'plugin';
        div.innerHTML = `
            <span class="num">#${p.num}</span>
            <div class="name">${p.name}</div>
            <div class="desc">${p.desc}</div>
            <div class="code">${p.code}</div>
            <span class="badge ${p.category}">${p.category}</span>
        `;
        container.appendChild(div);
    });
}

// ============================================================
// FILTERS
// ============================================================
const filterButtons = document.querySelectorAll('.filters button');
const searchInput = document.getElementById('searchInput');

let currentFilter = 'all';

filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderPlugins(currentFilter, searchInput.value);
    });
});

searchInput.addEventListener('input', () => {
    renderPlugins(currentFilter, searchInput.value);
});

// ============================================================
// FANOMBOKANA
// ============================================================
renderPlugins('all', '');

console.log('✅ Rakitrakatra V4.2.0 loaded!');
console.log('📦 Total plugins:', pluginsData.length);
console.log('💡 Ampiasao ny R. (ohatra: R.Z, R.Vektora2, R.Lalao...)');
</script>
