<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakitrakatra V4 Demo – Ady Goavana</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff1493;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255,20,147,0.5);
        }
    </style>
</head>
<body>
    <!-- Laharana ny canvas dia ho soloan'i Rakitrakatra hoazy -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Mampiditra ilay motera -->
    <script src="https://raw.githubusercontent.com/Mr-Maharo/rakitrakatra/main/rakitrakatra.js"></script>

    <script>
    // ============================================================
    // DEMO: Lalao Tsotra Mampiseho Ny Fahaizan'i Rakitrakatra V4
    // ============================================================
    (function() {
        // Alaina avy amin'ny motera ireo kilasy sy rafitra ilaina
        const { Lalao, Sehatra, Fanindry, Feo, Fizika, MpitantanaTween, Mpanamora, Vovoka, Kamera, Stats } = R;

        // ----------------------------------------------------------
        // Sehatra lehibe anatin'ilay lalao
        // ----------------------------------------------------------
        class LalaoScene extends Sehatra {
            init(data) {
                this.playerHP = 100;
                this.maxHP = 100;
                this.score = 0;
                this.obstacles = [];
                this.enemies = [];
                this.spawnInterval = 2000; // ms
            }

            create() {
                const game = this.game;
                const ecs = game.ecs;
                
                // Mamorona ny mpilalao (entity)
                this.pid = ecs.create();
                ecs.x[this.pid] = 400;
                ecs.y[this.pid] = 300;
                ecs.w[this.pid] = 32;
                ecs.h[this.pid] = 32;
                ecs.color[this.pid] = 0xFF4444FF; // mena
                ecs.tag[this.pid] = 1; // tag = player

                // Mamorona sakana (obstacles) mitsangana
                const obsPos = [
                    [200, 150, 64, 200],
                    [500, 100, 80, 80],
                    [300, 400, 120, 60],
                    [600, 350, 150, 40],
                    [100, 300, 50, 150]
                ];
                obsPos.forEach(([x,y,w,h]) => {
                    this.obstacles.push({ x, y, w, h });
                });

                // Fanaraha-maso (kamera) mi-follow mpilalao
                game.camera.follow(
                    { x: ecs.x[this.pid], y: ecs.y[this.pid], w: 32, h: 32 },
                    0.15
                );
                game.camera.setBounds(-100, -100, 1000, 800); // tontolo kely

                // Timer: miteraka fahavalo isaky ny 2 segondra
                game.timer.every(this.spawnInterval, () => this.spawnEnemy());

                // Tween tsotra ho an'ilay "vovoka" (fampisehoana)
                MpitantanaTween.to({ scale: 1 }, { scale: 2 }, 600, {
                    ease: 'elasticOut',
                    yoyo: true,
                    repeat: -1,
                    onUpdate: (t) => { this._pulse = t; }
                });

                // Andramo feo rehefa manindry bokotra (hamerenana ny AudioContext)
                Feo.init();
                document.addEventListener('click', () => Feo.resume(), { once: true });
            }

            // Miteraka fahavalo vaovao
            spawnEnemy() {
                const ecs = this.game.ecs;
                const eid = ecs.create();
                // Toerana miseho eo amin'ny sisin'ny efijery
                const side = Math.floor(Math.random() * 4);
                let x = 0, y = 0;
                const w = 30, h = 30;
                switch(side) {
                    case 0: x = Math.random() * 800; y = -h; break;
                    case 1: x = Math.random() * 800; y = 600; break;
                    case 2: x = -w; y = Math.random() * 600; break;
                    case 3: x = 800; y = Math.random() * 600; break;
                }
                ecs.x[eid] = x;
                ecs.y[eid] = y;
                ecs.w[eid] = w;
                ecs.h[eid] = h;
                ecs.color[eid] = 0x44FF44FF; // maitso
                ecs.tag[eid] = 2; // enemy
                ecs.hp[eid] = 30;
                ecs.maxHp[eid] = 30;
                // Velocité hanakaiky ny mpilalao
                this.enemies.push(eid);
            }

            // Fanavaozana ny lalao
            update(dt, dtMs) {
                const ecs = this.game.ecs;
                const pid = this.pid;

                // Hetsiky ny mpilalao (zava-manindry)
                const axis = Fanindry.axis();
                const speed = 250;
                let vx = axis.x * speed;
                let vy = axis.y * speed;

                // Fanavaozana ny toerana mpilalao
                let px = ecs.x[pid];
                let py = ecs.y[pid];
                let pw = ecs.w[pid];
                let ph = ecs.h[pid];

                // Hetsika miaraka amin'ny collision amin'ny sakana
                const newX = px + vx * dt;
                const newY = py + vy * dt;

                // Hamarinina raha misy fifandonana amin'ny sakana
                let canMoveX = true, canMoveY = true;
                for (const obs of this.obstacles) {
                    if (Fizika.rectVsRect(newX, py, pw, ph, obs.x, obs.y, obs.w, obs.h)) canMoveX = false;
                    if (Fizika.rectVsRect(px, newY, pw, ph, obs.x, obs.y, obs.w, obs.h)) canMoveY = false;
                }
                if (canMoveX) px = newX;
                if (canMoveY) py = newY;

                ecs.x[pid] = px;
                ecs.y[pid] = py;

                // Fanavaozana ny fahavalo
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const eid = this.enemies[i];
                    if (!ecs.isAlive(eid)) {
                        this.enemies.splice(i, 1);
                        continue;
                    }
                    const ex = ecs.x[eid];
                    const ey = ecs.y[eid];
                    const angle = Math.atan2(py + ph/2 - ey - ecs.h[eid]/2, px + pw/2 - ex - ecs.w[eid]/2);
                    const espeed = 120;
                    ecs.x[eid] += Math.cos(angle) * espeed * dt;
                    ecs.y[eid] += Math.sin(angle) * espeed * dt;

                    // Fizahana collision amin'ny mpilalao
                    if (Fizika.rectVsRect(
                        ecs.x[eid], ecs.y[eid], ecs.w[eid], ecs.h[eid],
                        px, py, pw, ph
                    )) {
                        // Mampihena HP ny mpilalao
                        this.playerHP -= 10;
                        this.playerHP = Math.max(0, this.playerHP);

                        // Feon'ny fahavoazana
                        Feo.mamorona('hit', { volume: 0.3 });

                        // Vovoka (explosion)
                        this.game.particles.emit(
                            ecs.x[eid] + ecs.w[eid]/2,
                            ecs.y[eid] + ecs.h[eid]/2,
                            {
                                count: 15,
                                speedMin: 40, speedMax: 120,
                                lifeMin: 0.3, lifeMax: 0.8,
                                sizeStart: 6, sizeEnd: 0,
                                color: 0x44FF44FF,
                                colorEnd: 0x44FF4488,
                                gravity: 200
                            }
                        );

                        // Hamafa ilay fahavalo
                        ecs.destroy(eid);
                        this.enemies.splice(i, 1);

                        // Raha lany HP
                        if (this.playerHP <= 0) {
                            console.log("Maty ianao! Avereno indray ny pejy.");
                            // Mety hampiato ny lalao eto
                        }
                    }
                }

                // Fanadiovana ny ECS (entity maty)
                ecs.compact();
            }

            // Fandokoana ny zavatra eo amin'ny tontolo (miaraka amin'ny kamera)
            render(renderer, camera) {
                // Asiana fiavana manga mainty
                renderer.drawRect(-50, -50, 900, 700, 0x111122FF);

                // Sakan-tsary (obstacles)
                for (const obs of this.obstacles) {
                    renderer.drawRect(obs.x, obs.y, obs.w, obs.h, 0x888888FF);
                }

                // Fahavalo
                const ecs = this.game.ecs;
                for (const eid of this.enemies) {
                    if (!ecs.isAlive(eid)) continue;
                    const x = ecs.x[eid], y = ecs.y[eid], w = ecs.w[eid], h = ecs.h[eid];
                    // Baran'ny HP ho an'ny fahavalo
                    const hpPct = ecs.hp[eid] / ecs.maxHp[eid];
                    renderer.drawRect(x, y - 5, w * hpPct, 3, 0x00FF00FF);
                    renderer.drawRect(x, y, w, h, ecs.color[eid]);
                }

                // Mpilalao
                if (ecs.isAlive(this.pid)) {
                    renderer.drawRect(
                        ecs.x[this.pid], ecs.y[this.pid],
                        ecs.w[this.pid], ecs.h[this.pid],
                        ecs.color[this.pid]
                    );
                }
            }

            // Fandokoana ny UI (tsy voakasiky ny kamera)
            renderUI(renderer) {
                // Baran'ny HP an'ny mpilalao
                const barWidth = 200, barHeight = 20;
                const barX = 10, barY = 10;
                renderer.drawRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4, 0x222222FF);
                renderer.drawRect(barX, barY, barWidth * (this.playerHP / this.maxHP), barHeight, 0xFF2222FF);
                // Fehy (border)
                renderer.drawRect(barX - 1, barY - 1, barWidth + 2, 1, 0xFFFFFFFF);
                renderer.drawRect(barX - 1, barY + barHeight, barWidth + 2, 1, 0xFFFFFFFF);
                renderer.drawRect(barX - 1, barY - 1, 1, barHeight + 2, 0xFFFFFFFF);
                renderer.drawRect(barX + barWidth, barY - 1, 1, barHeight + 2, 0xFFFFFFFF);

                // Isan'ny naoty (simulation an-tsoratra)
                const scoreStr = 'Score: ' + this.score;
                // Tsy misy rafitra soratra ofisialy, fa asiana tsipika fotsiny
                renderer.drawRect(600, 15, 80, 20, 0x222222FF);
                // Mba hampisehoana hoe miasa, dia ataovy miovaova ny habe
                if (this._pulse) {
                    renderer.drawRect(300, 300, 20 * this._pulse, 20 * this._pulse, 0xFFFF00FF);
                }

                // FPS: aseho amin'ny console na amin'ny anaram-pejy
                document.title = `FPS: ${this.game.stats.fps} | HP: ${this.playerHP}`;
            }
        }

        // ----------------------------------------------------------
        // MANOMBOKA NY LALAO
        // ----------------------------------------------------------
        window.addEventListener('load', () => {
            const canvas = document.getElementById('gameCanvas');
            // Mamorona ny lalao
            const game = new Lalao(800, 600, { canvas });

            // Ampiana ny sehatra (scene)
            game.addScene('main', LalaoScene);

            // Atombohy
            game.start('main');

            // Torolàlana fohy (console)
            console.log('%c🎮 Rakitrakatra V4 Demo %c"Ady Goavana"',
                'font-size:18px;color:#ff1493', 'color:#fff');
            console.log('%c→ Zana-tsipìka: mandehana | Avoahy ny feo %c🔊',
                'color:#0ff', 'color:yellow');
            console.log('%c→ Fahavalo maitso no hanafika anao %c👾', 'color:#0f0', '');
        });
    })();
    </script>
</body>
</html>
