<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rakitrakatra V4 · Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            background: #0d0d16;
            cursor: crosshair;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            color: #44aaff;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            flex-direction: column;
            gap: 15px;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(68, 170, 255, 0.1);
            border-top-color: #44aaff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #ui {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 1px;
            text-align: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 16px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.03);
            z-index: 10;
        }
        #ui span {
            color: rgba(255, 200, 100, 0.5);
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading">
        <div class="spinner"></div>
        <div>⏳ Mampiditra motera...</div>
    </div>

    <!-- UI OVERLAY -->
    <div id="ui">⬆ ⬇ ⬅ ➡ &nbsp;·&nbsp; <span>clic / tap</span> &nbsp;·&nbsp; tire</div>

    <!-- ============================================================ -->
    <!--  LOADER : Mampiditra ilay motera avy any ivelany              -->
    <!-- ============================================================ -->
    <script>
        (function() {
            const loading = document.getElementById('loading');

            // Mamorona script ho an'ny motera
            const script = document.createElement('script');
            script.src = 'rakitrakatra.js';
            script.async = false;

            script.onload = function() {
                console.log('✅ Moteur Rakitrakatra V4 tafiditra!');

                // Esory ny loading
                loading.style.opacity = '0';
                setTimeout(() => loading.style.display = 'none', 500);

                // Atombohy ny demo raha misy ny R
                if (typeof R !== 'undefined') {
                    initDemo();
                } else {
                    loading.innerHTML = '<div style="color:#ff4466;">❌ Erreur: moteur tsy hita</div>';
                }
            };

            script.onerror = function() {
                loading.innerHTML = `
                            <div style="color:#ff4466;text-align:center;line-height:1.6;">
                                ❌ Tsy hita ny <strong>rakitrakatra.js</strong><br>
                                <small style="font-size:14px;color:#888;">
                                    Apetraho amin'ny folder mitovy ity rakitra ity.
                                </small>
                            </div>
                        `;
            };

            document.head.appendChild(script);

            // ============================================================
            //  DEMO : Mampiasa ny fototry ny framework ihany
            // ============================================================
            function initDemo() {
                // Ampiasaintsika araka ny fomba ofisialin'ny framework
                const { Lalao, Sehatra, Z, Fanindry, Feo, UI, Fizika, Vovoka } = R;

                // --------------------------------------------------------
                //  SCÈNE : "Demo"
                // --------------------------------------------------------
                class DemoScene extends Sehatra {
                    constructor(key) {
                        super(key);
                        this.player = -1;
                        this.enemies = [];
                        this.bullets = [];
                        this.particles = null;
                        this.hpBar = null;
                        this.score = 0;
                        this.wave = 0;
                        this.gameOver = false;
                        this.shootCD = 0;
                    }

                    init(data) {
                        this.score = 0;
                        this.wave = 0;
                        this.enemies = [];
                        this.bullets = [];
                        this.gameOver = false;
                        this.shootCD = 0;
                    }

                    create() {
                        const ecs = this.game.ecs;
                        const cam = this.game.camera;

                        // --- Joueur ---
                        this.player = ecs.create();
                        const p = this.player;
                        ecs.x[p] = 400;
                        ecs.y[p] = 300;
                        ecs.w[p] = 30;
                        ecs.h[p] = 30;
                        ecs.color[p] = 0xFF44AAFF;
                        ecs.hp[p] = 100;
                        ecs.maxHp[p] = 100;
                        ecs.tag[p] = 1;

                        // --- Caméra ---
                        cam.follow(ecs, p, 0.08);
                        cam.setBounds(-50, -50, 900, 700);
                        cam.zoom = 1;

                        // --- Particules ---
                        this.particles = new Vovoka(3000);

                        // --- Barre de vie ---
                        this.hpBar = new UI.Bara(20, 20, 180, 16, {
                            max: 100,
                            value: 100,
                            bgColor: 0xCC222244,
                            fillColor: 0xFF44FF44
                        });

                        // --- Ennemis initiaux ---
                        for (let i = 0; i < 4; i++) this.spawnEnemy();

                        // --- Vagues ---
                        this.game.timer.every(5000, () => {
                            if (!this.gameOver) {
                                this.wave++;
                                for (let i = 0; i < Math.min(2 + this.wave, 6); i++) {
                                    this.spawnEnemy();
                                }
                                cam.shake(3, 120);
                                Feo.mamorona('power');
                            }
                        });
                    }

                    spawnEnemy() {
                        const ecs = this.game.ecs;
                        const cam = this.game.camera.getBounds();

                        const side = Math.floor(Math.random() * 4);
                        let x, y;
                        const cx = cam.x + cam.w / 2;
                        const cy = cam.y + cam.h / 2;

                        switch (side) {
                            case 0:
                                x = cx - cam.w / 2 - 20 + Math.random() * 40;
                                y = cy - cam.h / 2 + Math.random() * cam.h;
                                break;
                            case 1:
                                x = cx + cam.w / 2 + 20 - Math.random() * 40;
                                y = cy - cam.h / 2 + Math.random() * cam.h;
                                break;
                            case 2:
                                x = cx - cam.w / 2 + Math.random() * cam.w;
                                y = cy - cam.h / 2 - 20 + Math.random() * 40;
                                break;
                            case 3:
                                x = cx - cam.w / 2 + Math.random() * cam.w;
                                y = cy + cam.h / 2 + 20 - Math.random() * 40;
                                break;
                        }

                        const id = ecs.create();
                        const size = 18 + Math.random() * 14;
                        ecs.x[id] = Z.clamp(x, 20, 880);
                        ecs.y[id] = Z.clamp(y, 20, 680);
                        ecs.w[id] = size;
                        ecs.h[id] = size;
                        ecs.color[id] = 0xFFFF6644;
                        ecs.hp[id] = 1 + Math.floor(this.wave / 2);
                        ecs.maxHp[id] = ecs.hp[id];
                        ecs.tag[id] = 2;
                        ecs._speed = 50 + this.wave * 3;
                        ecs._dmg = 8 + Math.floor(this.wave / 2);

                        this.enemies.push(id);
                    }

                    shoot(targetX, targetY) {
                        if (this.gameOver) return;
                        if (this.shootCD > 0) return;
                        if (this.player < 0 || !this.game.ecs.isAlive(this.player)) return;

                        const ecs = this.game.ecs;
                        const p = this.player;
                        const px = ecs.x[p] + ecs.w[p] / 2;
                        const py = ecs.y[p] + ecs.h[p] / 2;

                        const angle = Math.atan2(targetY - py, targetX - px);
                        const speed = 400;

                        const id = ecs.create();
                        ecs.x[id] = px;
                        ecs.y[id] = py;
                        ecs.w[id] = 6;
                        ecs.h[id] = 6;
                        ecs.vx[id] = Math.cos(angle) * speed;
                        ecs.vy[id] = Math.sin(angle) * speed;
                        ecs.color[id] = 0xFF44FF88;
                        ecs.tag[id] = 3;
                        ecs.lifetime[id] = 1.5;

                        this.bullets.push(id);
                        this.shootCD = 0.15;
                        Feo.mamorona('laser');
                    }

                    update(dt, dtMs) {
                        if (this.gameOver) {
                            if (Fanindry.justPressed(' ')) this.restart();
                            return;
                        }

                        const ecs = this.game.ecs;
                        const cam = this.game.camera;

                        // Cooldown
                        if (this.shootCD > 0) this.shootCD -= dt;

                        // --- Joueur ---
                        const p = this.player;
                        if (ecs.isAlive(p)) {
                            const axis = Fanindry.axis();
                            const speed = 180;
                            ecs.vx[p] = Z.approach(ecs.vx[p], axis.x * speed, 600 * dt);
                            ecs.vy[p] = Z.approach(ecs.vy[p], axis.y * speed, 600 * dt);

                            ecs.x[p] = Z.clamp(ecs.x[p] + ecs.vx[p] * dt, 20, 880);
                            ecs.y[p] = Z.clamp(ecs.y[p] + ecs.vy[p] * dt, 20, 680);

                            // Tir
                            if (Fanindry.mouse.justDown[0]) {
                                this.shoot(Fanindry.mouse.worldX, Fanindry.mouse.worldY);
                            }
                            if (Fanindry.justPressed(' ')) {
                                const dir = Math.atan2(ecs.vy[p], ecs.vx[p]);
                                if (Math.hypot(ecs.vx[p], ecs.vy[p]) > 10) {
                                    this.shoot(ecs.x[p] + Math.cos(dir) * 100, ecs.y[p] + Math.sin(dir) * 100);
                                } else {
                                    this.shoot(ecs.x[p] + 50, ecs.y[p]);
                                }
                            }

                            this.hpBar.value = ecs.hp[p];
                            this.hpBar.max = ecs.maxHp[p];
                        }

                        // --- IA ennemis ---
                        const pPos = ecs.isAlive(p) ? { x: ecs.x[p], y: ecs.y[p] } : null;
                        const dead = [];
                        for (let i = 0; i < this.enemies.length; i++) {
                            const e = this.enemies[i];
                            if (!ecs.isAlive(e)) { dead.push(i); continue; }

                            if (pPos) {
                                const dx = pPos.x - ecs.x[e];
                                const dy = pPos.y - ecs.y[e];
                                const d = Math.hypot(dx, dy);
                                if (d > 1) {
                                    const spd = ecs._speed || 60;
                                    ecs.vx[e] = Z.approach(ecs.vx[e], (dx / d) * spd, 100 * dt);
                                    ecs.vy[e] = Z.approach(ecs.vy[e], (dy / d) * spd, 100 * dt);
                                }
                            }
                            ecs.x[e] = Z.clamp(ecs.x[e] + ecs.vx[e] * dt, 10, 890);
                            ecs.y[e] = Z.clamp(ecs.y[e] + ecs.vy[e] * dt, 10, 690);
                        }
                        for (let i = dead.length - 1; i >= 0; i--) {
                            this.enemies.splice(dead[i], 1);
                        }

                        // --- Projectiles ---
                        const deadBullets = [];
                        for (let i = 0; i < this.bullets.length; i++) {
                            const b = this.bullets[i];
                            if (!ecs.isAlive(b)) { deadBullets.push(i); continue; }

                            ecs.x[b] += ecs.vx[b] * dt;
                            ecs.y[b] += ecs.vy[b] * dt;

                            ecs.lifetime[b] -= dt;
                            if (ecs.lifetime[b] <= 0 || ecs.x[b] < -50 || ecs.x[b] > 950 || ecs.y[b] < -50 || ecs.y[b] >
                                750) {
                                ecs.destroy(b);
                                deadBullets.push(i);
                            }
                        }
                        for (let i = deadBullets.length - 1; i >= 0; i--) {
                            this.bullets.splice(deadBullets[i], 1);
                        }

                        // --- Collisions bullet → enemy ---
                        for (const b of this.bullets) {
                            if (!ecs.isAlive(b)) continue;
                            for (const e of this.enemies) {
                                if (!ecs.isAlive(e)) continue;
                                if (Fizika.rectVsRect(ecs.x[b], ecs.y[b], ecs.w[b] || 6, ecs.h[b] || 6,
                                        ecs.x[e], ecs.y[e], ecs.w[e] || 20, ecs.h[e] || 20)) {
                                    ecs.hp[e]--;
                                    if (ecs.hp[e] <= 0) {
                                        ecs.destroy(e);
                                        this.score++;
                                        // Effet
                                        const cx = ecs.x[e] + ecs.w[e] / 2;
                                        const cy = ecs.y[e] + ecs.h[e] / 2;
                                        for (let j = 0; j < 15; j++) {
                                            const a = Math.random() * Math.PI * 2;
                                            const s = 40 + Math.random() * 100;
                                            this.particles.emit(cx, cy, {
                                                count: 1,
                                                speedMin: s * 0.4,
                                                speedMax: s,
                                                angle: a,
                                                angleSpread: 0.6,
                                                lifeMin: 0.2,
                                                lifeMax: 0.5,
                                                sizeStart: 4 + Math.random() * 6,
                                                sizeEnd: 0,
                                                color: 0xFFFF6644,
                                                gravity: 50
                                            });
                                        }
                                        Feo.mamorona('hit');
                                        cam.shake(2, 80);
                                    }
                                    ecs.destroy(b);
                                    break;
                                }
                            }
                        }

                        // --- Collisions enemy → player ---
                        if (ecs.isAlive(p)) {
                            for (const e of this.enemies) {
                                if (!ecs.isAlive(e)) continue;
                                if (Fizika.rectVsRect(ecs.x[p], ecs.y[p], ecs.w[p] || 30, ecs.h[p] || 30,
                                        ecs.x[e], ecs.y[e], ecs.w[e] || 20, ecs.h[e] || 20)) {
                                    ecs.hp[p] -= ecs._dmg || 10;
                                    const dx = ecs.x[e] - ecs.x[p];
                                    const dy = ecs.y[e] - ecs.y[p];
                                    const d = Math.hypot(dx, dy) || 1;
                                    ecs.x[e] += (dx / d) * 20;
                                    ecs.y[e] += (dy / d) * 20;
                                    Feo.mamorona('hit');
                                    cam.shake(4, 100);

                                    if (ecs.hp[p] <= 0) {
                                        ecs.hp[p] = 0;
                                        this.gameOver = true;
                                        ecs.alpha[p] = 0.3;
                                        Feo.mamorona('explode');
                                        for (let j = 0; j < 25; j++) {
                                            const a = Math.random() * Math.PI * 2;
                                            const s = 50 + Math.random() * 150;
                                            this.particles.emit(ecs.x[p] + ecs.w[p] / 2, ecs.y[p] + ecs.h[p] / 2, {
                                                count: 1,
                                                speedMin: s * 0.3,
                                                speedMax: s,
                                                angle: a,
                                                angleSpread: 1.2,
                                                lifeMin: 0.3,
                                                lifeMax: 0.8,
                                                sizeStart: 6 + Math.random() * 8,
                                                sizeEnd: 0,
                                                color: 0xFF44AAFF,
                                                gravity: 20
                                            });
                                        }
                                    }
                                    break;
                                }
                            }
                        }

                        // --- Particules ---
                        this.particles.update(dt);
                    }

                    restart() {
                        this.gameOver = false;
                        this.score = 0;
                        this.wave = 0;
                        this.enemies = [];
                        this.bullets = [];

                        const ecs = this.game.ecs;
                        const p = this.player;
                        if (ecs.isAlive(p)) {
                            ecs.hp[p] = ecs.maxHp[p];
                            ecs.x[p] = 400;
                            ecs.y[p] = 300;
                            ecs.vx[p] = 0;
                            ecs.vy[p] = 0;
                            ecs.alpha[p] = 1;
                        }

                        for (let i = 0; i < 4; i++) this.spawnEnemy();
                        this.game.camera.shake(6, 150);
                        Feo.mamorona('power');
                    }

                    render(renderer, camera) {
                        const ecs = this.game.ecs;

                        // Entités
                        const draw = (id) => {
                            if (!ecs.isAlive(id)) return;
                            const x = ecs.x[id],
                                y = ecs.y[id];
                            const w = ecs.w[id] || 20,
                                h = ecs.h[id] || 20;
                            const c = ecs.color[id] || 0xFFFFFFFF;
                            const a = ecs.alpha[id] || 1;
                            const col = ((c >>> 24) << 24) | ((c >>> 16) << 16) | ((c >>> 8) << 8) | Math.floor(a * 255);
                            renderer.drawRect(x, y, w, h, col);
                        };

                        if (this.player >= 0) draw(this.player);
                        for (const e of this.enemies) draw(e);
                        for (const b of this.bullets) draw(b);
                    }

                    renderUI(renderer) {
                        if (this.hpBar) this.hpBar.render(renderer);

                        // Score
                        renderer.drawRect(20, 50, 220, 22, 0x88000000);
                        renderer.drawRect(22, 52, 216, 18, 0x44FFFFFF);

                        // Game Over
                        if (this.gameOver) {
                            renderer.drawRect(180, 200, 340, 120, 0xCC000000);
                            renderer.drawRect(190, 210, 320, 100, 0xCCFF2244);
                            renderer.drawRect(230, 250, 240, 4, 0xFFFFFFFF);
                            renderer.drawRect(230, 270, 180, 4, 0xFFFFFFFF);
                            renderer.drawRect(230, 290, 260, 4, 0xFFFFFFFF);
                        }
                    }
                }

                // --------------------------------------------------------
                //  LANCEMENT
                // --------------------------------------------------------
                // Mamorona canvas ary ampiana ao amin'ny body
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                document.body.prepend(canvas);

                const game = new Lalao(window.innerWidth, window.innerHeight, {
                    canvas: canvas,
                    maxEntities: 20000,
                    gameKey: 'demo'
                });

                game.addScene('demo', DemoScene);
                game.start('demo');

                // Redimensionnement
                window.addEventListener('resize', () => {
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    canvas.width = w;
                    canvas.height = h;
                    game.renderer.resize(w, h);
                    game.width = w;
                    game.height = h;
                    game.camera.viewW = w;
                    game.camera.viewH = h;
                });

                console.log('🎮 Demo Rakitrakatra V4 lancée !');
            }
        })();
    </script>
</body>
</html>
