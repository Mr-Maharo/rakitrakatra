<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Arena Survival</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #0a0a1a; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { border: 3px solid #2a2a4a; border-radius: 12px; background: #1a1a2e; cursor: crosshair; }
  </style>
</head>
<body>
<canvas id="game" width="900" height="600"></canvas>

<script>
// ============================================================
// 1. FANANGANANA
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 900, H = 600;

// ============================================================
// 2. ECS TSOTRA
// ============================================================
class ECS {
  constructor(max) {
    this.max = max;
    this.active = new Uint8Array(max);
    this.x = new Float32Array(max);
    this.y = new Float32Array(max);
    this.w = new Float32Array(max);
    this.h = new Float32Array(max);
    this.vx = new Float32Array(max);
    this.vy = new Float32Array(max);
    this.color = new Array(max);
    this.hp = new Float32Array(max);
    this.maxHp = new Float32Array(max);
    this.team = new Int8Array(max);
    this.speed = new Float32Array(max);
    this.friction = new Float32Array(max);
    this.damage = new Float32Array(max);
    this.lifetime = new Float32Array(max);
    this.age = new Float32Array(max);
    this.isBullet = new Uint8Array(max);
  }
  create() {
    for (let i = 0; i < this.max; i++) {
      if (!this.active[i]) {
        this.active[i] = 1;
        this.x[i] = 0; this.y[i] = 0; this.w[i] = 20; this.h[i] = 20;
        this.vx[i] = 0; this.vy[i] = 0; this.color[i] = '#FFFFFF';
        this.hp[i] = 100; this.maxHp[i] = 100; this.team[i] = 0;
        this.speed[i] = 100; this.friction[i] = 0.9; this.damage[i] = 0;
        this.lifetime[i] = 0; this.age[i] = 0; this.isBullet[i] = 0;
        return i;
      }
    }
    return -1;
  }
  forEach(callback) {
    for (let i = 0; i < this.max; i++) {
      if (this.active[i]) callback(i);
    }
  }
  destroy(id) {
    if (id >= 0 && id < this.max) this.active[id] = 0;
  }
}

const ecs = new ECS(5000);

// ============================================================
// 3. CONSTANTES
// ============================================================
const TEAM_PLAYER = 1;
const TEAM_ENEMY = 2;

let playerId = -1;
let score = 0;
let gameOver = false;
let enemySpawnTimer = 1.5;
let shootCooldown = 0;
const SHOOT_DELAY = 0.12;

// ============================================================
// 4. INPUT
// ============================================================
const keys = {};
let mouseX = 450, mouseY = 300;
let mouseDown = false;

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r' && gameOver) resetGame();
  if (e.key === ' ' || e.key === 'Space') {
    e.preventDefault();
    if (!gameOver) mouseDown = true;
  }
});
document.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (e.key === ' ' || e.key === 'Space') mouseDown = false;
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
  mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
});

canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  if (!gameOver) mouseDown = true;
});
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('mouseleave', () => mouseDown = false);

// ============================================================
// 5. FAMORONANA ZAVATRA
// ============================================================
function createPlayer() {
  const id = ecs.create();
  ecs.x[id] = 450;
  ecs.y[id] = 300;
  ecs.w[id] = 34;
  ecs.h[id] = 34;
  ecs.color[id] = '#44DDFF';
  ecs.hp[id] = 100;
  ecs.maxHp[id] = 100;
  ecs.team[id] = TEAM_PLAYER;
  ecs.speed[id] = 200;
  ecs.friction[id] = 0.88;
  return id;
}

function createEnemy(x, y) {
  const id = ecs.create();
  ecs.x[id] = x;
  ecs.y[id] = y;
  ecs.w[id] = 28;
  ecs.h[id] = 28;
  ecs.color[id] = '#FF4455';
  ecs.hp[id] = 30;
  ecs.maxHp[id] = 30;
  ecs.team[id] = TEAM_ENEMY;
  ecs.damage[id] = 10;
  ecs.speed[id] = 50 + Math.random() * 70;
  ecs.friction[id] = 0.95;
  return id;
}

function createBullet(x, y, tx, ty) {
  const id = ecs.create();
  ecs.x[id] = x - 5;
  ecs.y[id] = y - 5;
  ecs.w[id] = 10;
  ecs.h[id] = 10;
  ecs.color[id] = '#FFDD44';
  ecs.team[id] = TEAM_PLAYER;
  ecs.damage[id] = 25;
  ecs.lifetime[id] = 2.0;
  ecs.age[id] = 0;
  ecs.isBullet[id] = 1;

  const angle = Math.atan2(ty - y, tx - x);
  const speed = 520;
  ecs.vx[id] = Math.cos(angle) * speed;
  ecs.vy[id] = Math.sin(angle) * speed;
  return id;
}

// ============================================================
// 6. RAFITRA (SYSTEMS)
// ============================================================
function isColliding(a, b) {
  return ecs.x[a] < ecs.x[b] + ecs.w[b] &&
         ecs.x[a] + ecs.w[a] > ecs.x[b] &&
         ecs.y[a] < ecs.y[b] + ecs.h[b] &&
         ecs.y[a] + ecs.h[a] > ecs.y[b];
}

function playerSystem(dt) {
  if (gameOver || playerId === -1) return;
  const p = playerId;
  if (!ecs.active[p]) return;

  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy = -1;
  if (keys['s'] || keys['arrowdown']) dy = 1;
  if (keys['a'] || keys['arrowleft']) dx = -1;
  if (keys['d'] || keys['arrowright']) dx = 1;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }

  const spd = ecs.speed[p];
  ecs.vx[p] = dx * spd;
  ecs.vy[p] = dy * spd;

  if (shootCooldown > 0) shootCooldown -= dt;
  if (mouseDown && shootCooldown <= 0) {
    const cx = ecs.x[p] + ecs.w[p]/2;
    const cy = ecs.y[p] + ecs.h[p]/2;
    createBullet(cx, cy, mouseX, mouseY);
    shootCooldown = SHOOT_DELAY;
  }
}

function aiSystem(dt) {
  if (gameOver || playerId === -1) return;
  const p = playerId;
  if (!ecs.active[p]) return;

  ecs.forEach(id => {
    if (!ecs.active[id] || ecs.team[id] !== TEAM_ENEMY) return;
    const dx = ecs.x[p] - ecs.x[id];
    const dy = ecs.y[p] - ecs.y[id];
    const dist = Math.hypot(dx, dy);
    if (dist > 5) {
      const spd = ecs.speed[id] || 60;
      ecs.vx[id] = (dx / dist) * spd;
      ecs.vy[id] = (dy / dist) * spd;
    }
  });
}

function physicsSystem(dt) {
  ecs.forEach(id => {
    if (!ecs.active[id]) return;
    if (ecs.friction[id]) {
      ecs.vx[id] *= Math.pow(ecs.friction[id], dt * 60);
      ecs.vy[id] *= Math.pow(ecs.friction[id], dt * 60);
    }
    ecs.x[id] += ecs.vx[id] * dt;
    ecs.y[id] += ecs.vy[id] * dt;

    if (ecs.team[id] === TEAM_PLAYER) {
      ecs.x[id] = Math.max(0, Math.min(W - ecs.w[id], ecs.x[id]));
      ecs.y[id] = Math.max(0, Math.min(H - ecs.h[id], ecs.y[id]));
    }
  });
}

function lifetimeSystem(dt) {
  ecs.forEach(id => {
    if (!ecs.active[id] || !ecs.lifetime[id]) return;
    ecs.age[id] += dt;
    if (ecs.age[id] >= ecs.lifetime[id]) ecs.active[id] = 0;
  });
}

function combatSystem() {
  if (gameOver) return;
  const ids = ecs.getIds ? ecs.getIds() : (() => { const r=[]; ecs.forEach(id=>r.push(id)); return r; })();

  for (let i = 0; i < ids.length; i++) {
    const a = ids[i];
    if (!ecs.active[a]) continue;
    for (let j = i+1; j < ids.length; j++) {
      const b = ids[j];
      if (!ecs.active[b] || ecs.team[a] === ecs.team[b]) continue;
      if (!isColliding(a, b)) continue;

      if (ecs.damage[a] > 0) {
        ecs.hp[b] -= ecs.damage[a];
        if (ecs.hp[b] <= 0) {
          ecs.active[b] = 0;
          if (ecs.team[b] === TEAM_ENEMY) score += 10;
        }
        if (ecs.isBullet[a]) ecs.active[a] = 0;
      }
      if (ecs.damage[b] > 0) {
        ecs.hp[a] -= ecs.damage[b];
        if (ecs.hp[a] <= 0) {
          ecs.active[a] = 0;
          if (ecs.team[a] === TEAM_ENEMY) score += 10;
        }
        if (ecs.isBullet[b]) ecs.active[b] = 0;
      }
    }
  }

  if (playerId !== -1 && !ecs.active[playerId]) gameOver = true;
}

function spawnSystem(dt) {
  if (gameOver) return;
  enemySpawnTimer -= dt;
  if (enemySpawnTimer <= 0) {
    const count = 1 + Math.floor(score / 100);
    for (let i = 0; i < Math.min(count, 5); i++) {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = Math.random() * W; y = -30; }
      else if (side === 1) { x = W + 30; y = Math.random() * H; }
      else if (side === 2) { x = Math.random() * W; y = H + 30; }
      else { x = -30; y = Math.random() * H; }
      createEnemy(x, y);
    }
    enemySpawnTimer = Math.max(0.3, 1.8 - score / 300);
  }
}

// ============================================================
// 7. FANAOVANA SARY
// ============================================================
function drawEntity(id) {
  const x = ecs.x[id], y = ecs.y[id];
  const w = ecs.w[id] || 20, h = ecs.h[id] || 20;
  const color = ecs.color[id] || '#FFFFFF';

  ctx.fillStyle = color;
  ctx.shadowColor = color + '66';
  ctx.shadowBlur = 12;
  ctx.fillRect(x, y, w, h);
  ctx.shadowBlur = 0;

  if (ecs.team[id] === TEAM_PLAYER) {
    ctx.strokeStyle = '#FFFFFF44';
    ctx.lineWidth = 2;
    ctx.strokeRect(x-2, y-2, w+4, h+4);
  }

  if (ecs.team[id] === TEAM_ENEMY && ecs.maxHp[id]) {
    const hpRatio = ecs.hp[id] / ecs.maxHp[id];
    ctx.fillStyle = '#333';
    ctx.fillRect(x, y-8, w, 4);
    ctx.fillStyle = hpRatio > 0.5 ? '#44DD66' : '#FF6644';
    ctx.fillRect(x, y-8, w * hpRatio, 4);
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  const ids = [];
  ecs.forEach(id => { if (ecs.active[id]) ids.push(id); });
  for (const id of ids) drawEntity(id);
}

// ============================================================
// 8. RESET
// ============================================================
function resetGame() {
  ecs.forEach(id => ecs.active[id] = 0);
  playerId = -1;
  score = 0;
  gameOver = false;
  enemySpawnTimer = 1.5;
  shootCooldown = 0;
  mouseDown = false;
  
  playerId = createPlayer();
  for (let i = 0; i < 3; i++) {
    const x = 100 + Math.random() * 700;
    const y = 100 + Math.random() * 400;
    createEnemy(x, y);
  }
}

// ============================================================
// 9. GAME LOOP
// ============================================================
let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (!gameOver) {
    playerSystem(dt);
    aiSystem(dt);
    physicsSystem(dt);
    lifetimeSystem(dt);
    spawnSystem(dt);
    combatSystem();
  }

  render();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// 10. FANOMBOHANA
// ============================================================
playerId = createPlayer();
for (let i = 0; i < 3; i++) {
  const x = 100 + Math.random() * 700;
  const y = 100 + Math.random() * 400;
  createEnemy(x, y);
}

requestAnimationFrame(gameLoop);
console.log('✅ Lalao nanomboka! Misy mpilalao sy fahavalo 3.');
console.log('🕹️  WASD = mihetsika | SPACE = mitifitra | R = Reset');
</script>
</body>
</html>
